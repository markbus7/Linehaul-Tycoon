<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Linehaul Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1016;--panel:#151b23;--panel2:#1b232c;--line:#283442;
    --ink:#eef1f5;--dim:#8fa0b3;--dim2:#5f7086;
    --amber:#ffab2e;--green:#3ddb96;--red:#ff5b62;--blue:#4fb4f5;--violet:#c191f2;
    --sea:#0d1e2c;--land:#1d262f;--landln:#2d3a46;
    --font-display:'Rajdhani',ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  body{display:flex;flex-direction:column}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}

  header{display:flex;align-items:center;gap:16px;padding:10px 16px;flex:0 0 auto;flex-wrap:wrap;
    background:linear-gradient(180deg,#1c2530,#121820);border-bottom:1px solid #2b3742;
    box-shadow:0 2px 14px rgba(0,0,0,.45);position:relative;z-index:5}
  header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,171,46,.55),rgba(79,180,245,.35),transparent)}
  .brand{font-family:var(--font-display);font-weight:700;letter-spacing:.14em;font-size:18px;
    display:flex;align-items:center;gap:7px}
  .brand .bmark{font-size:17px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
  .brand .bword{background:linear-gradient(180deg,#ffd88f,#ff9d1f);-webkit-background-clip:text;background-clip:text;
    color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.4)}
  .stat{display:flex;flex-direction:column;line-height:1.15}
  .stat .k{font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim2)}
  .stat .v{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .v.money{color:var(--amber)} .v.ok{color:var(--green)} .v.bad{color:var(--red)} .v.warn2{color:var(--amber)}
  .netstat{min-width:74px}
  .sp{flex:1}
  .lvlstat{min-width:78px}
  .xpbar{height:3px;border-radius:2px;background:#2b3742;margin-top:3px;overflow:hidden}
  .xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a63c,#ffd08a)}
  .achbar{height:3px;border-radius:2px;background:#2b3742;margin-top:5px;overflow:hidden}
  .achbar i{display:block;height:100%;background:linear-gradient(90deg,#5fa5e0,#8ec2f2)}
  .achp{font-size:10px;color:#7f8b99;margin-top:2px}
  .ach{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:11px;margin-bottom:7px;
    background:linear-gradient(180deg,#1a222b,#151c24);border:1px solid #28323d;opacity:.55}
  .ach.got{opacity:1;border-color:#3f5136;background:linear-gradient(180deg,#1d2a20,#161f19)}
  .ach .ai{font-size:20px;width:34px;height:34px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
    background:#212a34;border:1px solid #2f3b48}
  .ach.got .ai{background:#22331f;border-color:#3f5136}
  .ach .an{font-weight:650;font-size:12.5px}
  .ach .ad{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.45}
  .ach .ar{font-family:ui-monospace,monospace;font-size:11px;color:var(--amber);flex:0 0 auto}
  .ach.got .ar{color:var(--green)}
  .lock{font-size:10px;color:#6d7a89;font-family:ui-monospace,monospace}
  .gbody p{font-size:13.5px;line-height:1.7;color:#c6ced8;margin-bottom:11px}
  .gbody em{color:#ffd08a;font-style:normal;font-weight:650}
  .gnav{display:flex;align-items:center;gap:12px;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
  .gdots{flex:1;display:flex;gap:5px;justify-content:center}
  .gd{width:6px;height:6px;border-radius:50%;background:#2f3b48;display:block}
  .gd.on{background:var(--amber);box-shadow:0 0 6px rgba(240,166,60,.6)}
  .hbtn{font-family:var(--font-display);padding:7px 13px;border:1px solid #33404d;border-radius:10px;
    font-size:13px;font-weight:700;letter-spacing:.02em;
    background:linear-gradient(180deg,#2b3541,#1d252e);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.35);
    transition:border-color .15s,color .15s,transform .1s}
  .hbtn:hover{border-color:var(--amber);color:#ffd08a}
  .hbtn:active{transform:translateY(1px)}
  .hbtn.on{border-color:var(--amber);color:var(--amber)}

  main{flex:1;display:flex;min-height:0}
  @media(max-width:900px){main{flex-direction:column}}
  .mapwrap{flex:1;position:relative;background:var(--sea);min-height:0;overflow:hidden;touch-action:none}
  .mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(130% 95% at 50% 45%,transparent 55%,rgba(3,7,11,.55) 100%)}
  svg{width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;touch-action:none}
  aside{width:400px;flex:0 0 auto;border-left:1px solid #2b3742;background:var(--panel);
    display:flex;flex-direction:column;min-height:0;box-shadow:-8px 0 24px rgba(0,0,0,.35)}
  @media(max-width:900px){aside{width:auto;border-left:none;border-top:1px solid var(--line);height:47%}}
  .tabs{display:flex;flex:0 0 auto;border-bottom:1px solid #2b3742;
    background:linear-gradient(180deg,#1a222b,#151c24);padding:0 4px}
  .tabs button{font-family:var(--font-display);flex:1;padding:11px 4px;font-size:12.5px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--dim);position:relative;transition:color .15s}
  .tabs button:hover{color:#b9c4d0}
  .tabs button.on{color:#ffd08a}
  .tabs button.on::after{content:"";position:absolute;left:8%;right:8%;bottom:-1px;height:2.5px;
    border-radius:2px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
  .tabs .bdg{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:8px;
    background:var(--line);color:var(--ink);font-size:10px;line-height:16px;font-family:ui-monospace,monospace}
  .tabs .bdg.warn{background:#5a2420;color:#ffb3a8}
  .nextstep{flex:0 0 auto;padding:9px 12px;background:linear-gradient(180deg,#1d2a22,#182219);
    border-bottom:1px solid #2f4436;cursor:pointer}
  .nextstep .nsk{font-family:var(--font-display);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
    color:#6f9c7e;font-weight:700}
  .nextstep .nst{font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--ink);margin-top:2px}
  .nextstep .nsw{font-size:11.5px;color:#9fb0a4;margin-top:3px;line-height:1.5}
  .nextstep .nsp{height:3px;border-radius:2px;background:#2b3742;margin-top:7px;overflow:hidden}
  .nextstep .nsp i{display:block;height:100%;background:linear-gradient(90deg,#4fc98a,#8fe3b4)}
  .nextstep.done{background:linear-gradient(180deg,#26221a,#1f1c16);border-bottom-color:#4a3f2a}
  .nextstep.done .nsk{color:#c9a25f}
  .body{flex:1;overflow-y:auto;padding:11px;-webkit-overflow-scrolling:touch;
    background:radial-gradient(120% 60% at 50% 0%,#171f27,#121820)}
  .body::-webkit-scrollbar{width:9px}
  .body::-webkit-scrollbar-thumb{background:#2b3742;border-radius:5px;border:2px solid transparent;background-clip:padding-box}
  .body::-webkit-scrollbar-thumb:hover{background:#3a4756;background-clip:padding-box}

  .card{background:linear-gradient(180deg,#1d2731,#171e26);border:1px solid #2c3947;border-radius:13px;
    padding:11px;margin-bottom:8px;position:relative;overflow:hidden;transition:border-color .15s,transform .12s;
    box-shadow:0 1px 0 rgba(255,255,255,.035) inset,0 3px 10px rgba(0,0,0,.28)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
  .card.warn{border-color:#57431f}   .card.warn::before{background:linear-gradient(180deg,#ffab2e,#8a5c17)}
  .card.bad{border-color:#5a2c26}    .card.bad::before{background:linear-gradient(180deg,#ff5b62,#8a2f26)}
  .card.good::before{background:linear-gradient(180deg,#3ddb96,#1f6f4a)}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  .ttl{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:.01em}
  .sub{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.5}
  .lbl{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:#8898aa;margin:14px 2px 8px;display:flex;align-items:center;gap:8px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#2b3742,transparent)}
  .lbl:first-child{margin-top:2px}
  .btn{font-family:var(--font-display);background:linear-gradient(180deg,#ffc35e,#f0930f);color:#1b1206;
    font-weight:700;font-size:13.5px;letter-spacing:.01em;
    padding:8px 14px;border-radius:10px;white-space:nowrap;
    box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 8px rgba(240,147,15,.32);transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
  .btn:disabled{background:#242d38;color:#5d6b7a;box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:linear-gradient(180deg,#272f3a,#1c242d);border:1px solid #34404d;color:var(--ink);
    font-weight:700;box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .btn.danger{background:linear-gradient(180deg,#4a221c,#341714);border:1px solid #5c2b24;color:#ffb3a8;box-shadow:none}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:7px;background:#26313d;color:#9aa8b6;
    font-family:ui-monospace,monospace;border:1px solid #2f3b48}
  .pill.g{background:#13301f;color:#7fdba6;border-color:#1e4a31}
  .pill.r{background:#3a1714;color:#ffa79b;border-color:#5c2a24}
  .pill.a{background:#332512;color:#f3c07a;border-color:#4d3818}
  .pill.b{background:#132534;color:#8ec6f0;border-color:#1e3c52}
  .svcverdict{margin-top:9px;line-height:1.7}
  .vrate{font-family:ui-monospace,monospace;font-size:11px;font-weight:700;margin-left:6px}
  .vrate.good{color:var(--green)} .vrate.warn{color:var(--amber)} .vrate.bad{color:var(--red)}
  .empty{color:var(--dim);font-size:12.5px;text-align:center;padding:30px 18px;line-height:1.75;
    background:linear-gradient(180deg,#1a222b,#151c24);border:1px dashed #303c49;border-radius:12px}
  .empty b{color:var(--ink)}

  /* map furniture */
  .land{fill:url(#landG);stroke:#3a4756;stroke-width:.7;vector-effect:non-scaling-stroke;
        stroke-linejoin:round;transition:fill .6s ease}
  .land.mine{fill:url(#landMine);stroke:#5d6b4a}
  .grat{stroke:#1a2836;stroke-width:.6;opacity:.5;vector-effect:non-scaling-stroke;fill:none}
  .svccase{fill:none;stroke:#070d13;stroke-width:6;opacity:.85;stroke-linejoin:round;
           stroke-linecap:round;vector-effect:non-scaling-stroke}
  .svcline{fill:none;stroke-width:3;opacity:.95;stroke-linejoin:round;stroke-linecap:round;
           vector-effect:non-scaling-stroke;cursor:pointer}
  .svcflow{fill:none;stroke-width:2;opacity:.6;stroke-linecap:round;vector-effect:non-scaling-stroke;
           stroke-dasharray:1 13;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .cshadow{fill:#04080c;opacity:.55;pointer-events:none}
  .cpad{fill:url(#padG);stroke:#55677c;stroke-width:1.4;vector-effect:non-scaling-stroke;
        cursor:pointer;transition:stroke .3s}
  .cpad.served{fill:url(#padOn);stroke:var(--green);stroke-width:1.8}
  .cpad.home{fill:url(#padHome);stroke:var(--amber);stroke-width:2}
  .cpad.sel{stroke:#fff;stroke-width:2.6}
  .cpad.addable{stroke-dasharray:2.5 2;cursor:pointer}
  .cpad.inedit{cursor:pointer}
  .cpad.locked{opacity:.42;stroke-dasharray:1.5 2.5}
  .clabel.locked{opacity:.5}
  .editpreview{fill:none;stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round;opacity:.9;
    vector-effect:non-scaling-stroke;pointer-events:none}
  /* route colour tells you how a service is doing at a glance -- green pays,
     amber is treading water, red is losing money and dashed to make sure it
     doesn't rely on colour alone. Tap the line for the full breakdown. */
  .svcline.perf-good{stroke:var(--green)}
  .svcline.perf-warn{stroke:var(--amber)}
  .svcline.perf-bad{stroke:var(--red);stroke-dasharray:6 5;opacity:.8}
  .cglyph{pointer-events:none;text-anchor:middle;dominant-baseline:central}
  .chalo{fill:none;stroke:var(--green);stroke-width:1.2;opacity:0;vector-effect:non-scaling-stroke}
  .chalo.on{opacity:.5;animation:halo 2.2s ease-in-out infinite;will-change:opacity}
  @keyframes halo{0%{opacity:.55}70%{opacity:.12}100%{opacity:.55}}
  .cbadge{fill:var(--amber);stroke:#1a1206;stroke-width:.8;vector-effect:non-scaling-stroke}
  .cbadge-t{fill:#1a1206;font-size:7px;font-weight:800;text-anchor:middle;dominant-baseline:central;
            pointer-events:none}
  .lplate{fill:#070d13;opacity:.66;rx:3}
  .cring{fill:none;stroke:#4a5a6a;stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
  .cinv{fill:none;stroke:var(--amber);stroke-width:1.2;opacity:.75;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
  .clabel{fill:#a7b3c1;font-size:10px;font-weight:500;pointer-events:none;paint-order:stroke;
    stroke:var(--sea);stroke-width:3px;stroke-linejoin:round}
  .clabel.served{fill:var(--ink);font-weight:650}
  .clabel.hide{display:none}
  .veh{pointer-events:none}
  .load-pip{fill:var(--amber);pointer-events:none}

  .modal{position:fixed;inset:0;background:rgba(4,7,10,.72);display:none;align-items:center;justify-content:center;
    z-index:50;padding:14px}
  .modal.show{display:flex}
  .mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:460px;
    max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
  .mhead{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
  .mhead h2{font-size:15px;font-weight:700;flex:1}
  .mbody{padding:14px;overflow-y:auto}
  .mbody p{font-size:13px;color:#c3cbd5;line-height:1.65;margin-bottom:9px}
  .mbody h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber);margin:16px 0 6px}
  .mbody h3:first-child{margin-top:0}
  .mbody em{color:var(--ink);font-style:normal;font-weight:600}

  .kv{display:flex;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;margin-bottom:6px}
  .kv .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);flex:0 0 88px;padding-top:2px}
  .kv.mini{flex-direction:column;gap:3px;padding:7px 9px}
  .kv.mini .k{flex:none;padding-top:0}
  .kv.mini .v{font-family:ui-monospace,monospace;font-size:13px}
  .kv .v{flex:1;font-size:12.5px;line-height:1.55}
  .goods{display:flex;flex-wrap:wrap;gap:4px}
  .good{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--line);color:#cbd4de;white-space:nowrap}
  .good.out{background:#2a2216;color:#f0c98a}
  .good.in{background:#16262e;color:#95c9e0}

  .stops{display:flex;flex-direction:column;gap:5px}
  .stop{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);
    border-radius:9px;padding:7px 9px;transition:transform .15s}
  .stop.dragging{transition:none;opacity:.92;box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:5;position:relative}
  .draghandle{cursor:grab;color:#5f6c7a;font-size:15px;padding:2px 5px;touch-action:none;flex:0 0 auto;
    user-select:none}
  .stop.dragging .draghandle{cursor:grabbing}
  .stopn{width:19px;height:19px;border-radius:50%;background:var(--line);display:grid;place-items:center;
    font-size:10px;font-family:ui-monospace,monospace;color:var(--amber);flex:0 0 auto}
  .stopbtn{width:25px;height:25px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
    font-size:11px;display:grid;place-items:center}
  .stopbtn:disabled{opacity:.28}
  .vopt{margin-top:7px;border-top:1px solid var(--line);padding-top:7px}
  .optrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
  .optk{font-size:10px;color:var(--dim2);letter-spacing:.05em;text-transform:uppercase;
    flex:0 0 68px}
  .optb{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--dim);
    font-size:10.5px;padding:3px 7px;min-height:24px}
  .optb.on{background:#233043;border-color:var(--blue);color:var(--ink);font-weight:650}
  .gtile{width:38px;height:38px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;
    font-size:19px;background:linear-gradient(180deg,#28323d,#1b232b);border:1px solid #333f4c;
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
  .ld .wt{font-family:ui-monospace,monospace;font-size:11px;color:#8e9bab;font-weight:600}
  .route2{font-size:11.5px;color:#aeb9c6;margin-top:3px;line-height:1.5}
  .route2 b{color:var(--ink);font-weight:600}
  .route2 .ar{color:var(--amber);margin:0 6px}
  .money{text-align:right;flex:0 0 auto}
  .money .amt{font-family:ui-monospace,monospace;font-weight:700;font-size:13.5px;color:#5fd79b}
  .money .pill{margin-top:4px}
  .plan{margin-top:9px;padding:8px 10px;background:#10161c;border-left:2px solid var(--line);
    border-radius:0 8px 8px 0;font-size:11px;line-height:1.65;color:#b6c0cb}
  .plan.ok{border-left-color:var(--green)} .plan.tight{border-left-color:var(--amber)}
  .plan.late{border-left-color:var(--red)} .plan.none{border-left-color:var(--red);color:#ffa79b}
  .plan .leg{display:block}
  .plan .xfer{color:var(--amber)}
  .toasts{position:absolute;left:10px;bottom:10px;right:10px;display:flex;flex-direction:column;gap:6px;
    pointer-events:none;z-index:8}
  .toast{background:rgba(20,26,33,.96);border:1px solid var(--line);border-left:3px solid var(--amber);
    border-radius:9px;padding:9px 12px;font-size:12px;line-height:1.5;animation:tin .25s ease}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:7}
  .mapctl button{width:34px;height:34px;border-radius:9px;background:rgba(20,26,33,.94);border:1px solid var(--line);
    font-size:15px;display:grid;place-items:center}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="bmark">🚛</span><span class="bword">LINEHAUL</span>
    <span style="font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600;letter-spacing:.02em;font-size:10px;color:var(--dim2)">NETWORK v9.2</span></div>
  <div class="stat"><div class="k">Cash</div><div class="v money" id="hCash">—</div></div>
  <div class="stat"><div class="k">On time</div><div class="v ok" id="hOnTime">—</div></div>
  <div class="stat netstat"><div class="k">Net / h</div><div class="v" id="hNet">—</div></div>
  <div class="stat lvlstat"><div class="k">Level</div><div class="v" id="hLvl">1</div>
    <div class="xpbar"><i id="hXp"></i></div></div>
  <div class="sp"></div>
  <button class="hbtn" id="btnSpeed">▶ 1×</button>
  <button class="hbtn" id="btnHelp">?</button>
</header>
<main>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" preserveAspectRatio="xMidYMid meet">
      <defs>
        <radialGradient id="seaG" cx="50%" cy="38%" r="78%">

function haversine(a,b){
  var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}

function eur(n){ n=Math.round(n);
  if(Math.abs(n)>=1e6) return "€"+(n/1e6).toFixed(2)+"M";
  if(Math.abs(n)>=1e4) return "€"+Math.round(n/1e3)+"k";
  if(Math.abs(n)>=1000) return "€"+(n/1e3).toFixed(1)+"k";
  return "€"+n; }
function hrs(h){ if(h<1) return Math.round(h*60)+"m"; if(h<48) return h.toFixed(1).replace(/\.0$/,"")+"h";

// a load with a `req` can only ride a truck carrying that equipment
// What a vehicle is physically able to carry.
//   tanker / bulk carrier  -- liquids only. A tank cannot hold boxes.
//   car transporter        -- finished cars only, for the same reason.
//   reefer / reefer plane  -- a refrigerated trailer is still a box, so it
//                             carries dry freight as well as food, exactly as
//                             real reefers do on their return legs.
//   everything else        -- general freight only.
// (This used to read `!TRUCKS[type].spec || true`, which is always true, so
//  every specialised vehicle could also haul general cargo -- making tankers
//  and transporters strictly better than plain trucks rather than a trade-off.)
function truckCan(type,good){
  var r=GOODS[good]&&GOODS[good].req, sp=TRUCKS[type].spec;
  if(!r) return !sp || sp==="reefer";
  return sp===r;
}
// Load rules the player sets per vehicle: how full it insists on being before
// it will leave a stop, and whether it takes anything or holds out for one
// kind of freight.
var FILL_OPTS=[{v:1,n:"Full load"},{v:0.5,n:"50% full"},{v:0.25,n:"25% full"},{v:0,n:"Don't wait"}];
// "Wait until full" means exactly that -- a truck holds out as long as new
// freight keeps trickling in, rather than running half empty. It only gives
// up if a full day passes with nothing new to show for the wait (STALL_GIVEUP),
// or the player cuts the wait short themselves with the manual override.
var STALL_GIVEUP=24;
var MIN_LOAD_T=3;  // spawnLoad never creates a load smaller than this
// Default is a full load: an empty or half-empty truck still burns the same
// wages and nearly the same fuel, so waiting to fill up is the sane opening
// position. `null` means "never set", which is what an older save carries.
function vFill(v){ return v.minFill==null ? 1 : v.minFill; }
function vPick(v){ return v.pickG||"all"; }
// goods this vehicle is allowed to load right now, given its own equipment and
// the freight-type filter the player chose
function vehTakes(v,good){
  if(!truckCan(v.type,good)) return false;
  var p=vPick(v);
  return p==="all" || p===good;
}
// Ships need a port at every stop, planes an air hub at every stop, and a
// road vehicle needs every stop reachable overland -- Europe/Africa/Asia are
// one connected landmass, the Americas another, and Oceania is islands-only.
function vehCanServe(type,s){
  var T=TRUCKS[type];
  if(T.mode==="sea") return s.stops.every(function(id){return CITY[id].port;});
  if(T.mode==="air") return s.stops.every(function(id){return CITY[id].air;});
  if(!s.stops.length) return true;
  var lm=cityLandmass(CITY[s.stops[0]]);
  return s.stops.every(function(id){return cityLandmass(CITY[id])===lm;});
}
function vehCantServeWhy(type,s){
  var T=TRUCKS[type];
  if(T.mode==="sea") return "needs a port at every stop";
  if(T.mode==="air") return "needs an air hub at every stop";
  return "can't cross an ocean — this loop spans more than one landmass";
}
function specsOn(s){
  var out={gen:false};
  svcVehs(s).forEach(function(v){ var sp=TRUCKS[v.type].spec; if(sp) out[sp]=true; else out.gen=true; });
  return out;
}
// Which goods this loop can actually earn from: a stop that SHIPS something
// paired with a different stop that TAKES it. A loop with no such pair earns
// nothing at all no matter how many trucks are on it -- the single most
// confusing failure in the game, because nothing on screen used to say so.
function svcTradePairs(s){
  var out=[], seen={};
  if(!s.stops||s.stops.length<2) return out;
  s.stops.forEach(function(fromId){
    (CITY[fromId].out||[]).forEach(function(g){
      s.stops.forEach(function(toId){
        if(toId===fromId) return;
        if((CITY[toId].in||[]).indexOf(g)<0) return;
        var k=g+fromId+toId; if(seen[k]) return; seen[k]=1;
        out.push({g:g, from:fromId, to:toId});
      });
    });
  });
  return out;
}
function svcCanCarry(s,good){
  var r=GOODS[good]&&GOODS[good].req;
  var sp=specsOn(s);
  return r? !!sp[r] : sp.gen || Object.keys(sp).some(function(k){return k!=="gen"&&sp[k];});
}

/* ============================================================ STATE */
var S = null, nextId = 1;
var WAGE_PER_H = 3.2;   // per truck, per game hour
// Cities you start with: your yard plus the tight Rhine cluster around it, so
// there is an immediately playable network before any unlocking is needed.
var STARTER_CITIES=["duiven","rotterdam","antwerp","duisburg","koln"];
function fresh(){
  var unlocked={}; STARTER_CITIES.forEach(function(id){ unlocked[id]=1; });
  return {
    cash: 260000, t: 0, xp:0, level:1, upg:{}, ach:{},   // t = game hours since start
    svcs: [], veh: [], loads: [],
    delivered: 0, late: 0, earned: 0, spent: 0,
    hist: {},                        // per-city history -> the mental story
    netHist: [], histStep: 2, lastHistT: 0,   // company net-worth over time -> the "am I winning" chart
    seen: {}, speed: 1, unlocked: unlocked,
    netEma: null, svcEma: {}, svcEarnEma: {}, svcCostEma: {}, svcActiveH: {},  // live profit/loss, company-wide and per service
    vehEma: {}, vehEarnEma: {}, vehCostEma: {}, vehActiveH: {}                 // same, but per truck
  };
}
// exponential moving average toward `instant`, with a game-hour time constant --
// this is what turns noisy per-tick cash flow into a readable trend
// Earnings arrive as lump sums when a truck completes a delivery -- roughly
// every headway, so every 5-10 game hours. Smoothing over only 3 hours meant
// the readout spiked on each delivery and sagged to negative in between, so a
// perfectly healthy line flickered between "Profitable" and "Losing money".
// A full game day spans several deliveries and gives a stable, honest trend.
var EMA_TAU=24;
// Hysteresis so the verdict word does not flap around a threshold: it takes a
// clearly positive rate to earn "Profitable" and a clearly negative one to be
// called "Losing money", with a wide neutral band in between that a service
// falls back into before it can flip to the opposite verdict.
function classifyRate(rate, last){
  if(last==="good") return rate<-8 ? (rate<-25?"bad":"warn") : "good";
  if(last==="bad")  return rate>8  ? (rate>25?"good":"warn") : "bad";
  if(rate>25) return "good";
  if(rate<-25) return "bad";
  return "warn";
}
function emaStep(prev, instant, dt, tau){
  if(prev==null) return instant;
  var k = 1-Math.exp(-dt/tau);
  return prev + (instant-prev)*k;
}
// Turns the net-worth samples into plotting-ready points, scaled into a
// fixed 0..100 x 0..34 box regardless of how much history there is or how
// wide the swings are -- the caller just drops the points into an <svg
// viewBox="0 0 100 34">. Always ends on the live cash figure, so the line
// reaches "right now" even between samples.
function netHistChart(){
  var hst=(S.netHist||[]).slice();
  hst.push({t:S.t,cash:S.cash});
  if(hst.length<2) return null;
  var W=100,H=34,PAD=2;
  var minC=hst[0].cash,maxC=hst[0].cash;
  hst.forEach(function(p){ if(p.cash<minC)minC=p.cash; if(p.cash>maxC)maxC=p.cash; });
  if(maxC===minC){ maxC+=1; minC-=1; }
  var t0=hst[0].t, t1=hst[hst.length-1].t;
  var span=Math.max(1e-6,t1-t0);
  var pts=hst.map(function(p){
    var x=PAD+(W-2*PAD)*((p.t-t0)/span);
    var y=PAD+(H-2*PAD)*(1-(p.cash-minC)/(maxC-minC));
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var line=pts.join(" ");
  var area=pts[0].split(",")[0]+","+(H-PAD)+" "+line+" "+pts[pts.length-1].split(",")[0]+","+(H-PAD);
  return {W:W,H:H,line:line,area:area,up:hst[hst.length-1].cash>=hst[0].cash,t0:t0};
}
// How cash has moved over roughly the last week of play -- the direct answer
// to "am I doing better or worse than before". Falls back to the oldest
// sample on hand if the game is younger than that.
function netHistDelta(){
  var hst=S.netHist||[];
  if(!hst.length) return null;
  var target=S.t-168, ref=hst[0];
  for(var i=0;i<hst.length;i++){ if(hst[i].t<=target) ref=hst[i]; else break; }
  var days=(S.t-ref.t)/24;
  if(days<0.15) return null;   // too little elapsed time to mean anything
  return {change:S.cash-ref.cash, days:days};
}
function rep(v){ if(!S.recent) S.recent=[]; S.recent.push(v); if(S.recent.length>40) S.recent.shift(); }
function repScore(){ if(!S.recent||!S.recent.length) return 1;
  var t=0; S.recent.forEach(function(v){t+=v;}); return t/S.recent.length; }
function hist(id){ if(!S.hist[id]) S.hist[id]={out:0,in:0,paid:0,late:0,first:null}; return S.hist[id]; }

/* ============================================================ LOADS
   Generated from the real produce/consume chains above, weighted toward
   nearby pairs so regional corridors dominate early and long hauls appear
   as the network grows.                                                   */
var PRODUCERS={}, CONSUMERS={};
Object.keys(GOODS).forEach(function(g){
  PRODUCERS[g]=CITIES.filter(function(c){return (c.out||[]).indexOf(g)>=0;});
  CONSUMERS[g]=CITIES.filter(function(c){return (c.in||[]).indexOf(g)>=0;});
});
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
// How much freight a single city will hold waiting for collection. Bigger
// places generate more trade, and a freight office there wins more still.
function cityCap(c){ return 4 + Math.round(c.size*0.8) + 2*officeLvl(c.id); }
function cityWaiting(id){
  var n=0; for(var i=0;i<S.loads.length;i++){ var l=S.loads[i];
    if(!l.on && l.at===id) n++; }
  return n;
}
function spawnLoad(){
  // Freight used to be capped globally at 6+3*trucks -- 12 loads for the entire
  // world with a starting fleet, which the game sat against ~84% of the time.
  // Anything stuck at one city therefore starved every other city of new work.
  // The ceiling is per city now, so clearing a backlog genuinely makes room for
  // that city to offer more, with a looser global bound just to keep the load
  // list and the router bounded.
  var capLoads=Math.min(90, 14+5*S.veh.length);
  if(S.loads.length>=capLoads) return;
  // Only cities you have unlocked can offer or receive freight. A shipper in a
  // city where you have no presence at all would never call you -- and since an
  // expired load used to bill you, offering work between two locked cities was
  // charging the player for jobs they had no possible way to accept.
  var opnP={}, opnC={};
  Object.keys(GOODS).forEach(function(g){
    opnP[g]=PRODUCERS[g].filter(function(c){return !cityLocked(c.id);});
    opnC[g]=CONSUMERS[g].filter(function(c){return !cityLocked(c.id);});
  });
  var gs=Object.keys(GOODS).filter(function(g){return opnP[g].length&&opnC[g].length;});
  if(!gs.length) return;
  var g=pick(gs);
  // Business follows your network. Most freight offered touches a city you
  // actually serve, so building a service immediately brings work -- with a
  // slice from elsewhere so you can still see what you are missing.
  var served=servedCities(), servedIds=Object.keys(served);
  var from;
  // First try to offer work that runs between two cities you serve -- winning a
  // customer is the reward for having built a useful corridor.
  if(servedIds.length && Math.random()<0.68){
    var pairGoods=gs.filter(function(gg){
      return opnP[gg].some(function(c){return served[c.id];}) &&
             opnC[gg].some(function(c){return served[c.id];}); });
    if(pairGoods.length){
      g=pick(pairGoods);
      var ps=opnP[g].filter(function(c){return served[c.id];});
      // weight origins by freight office too
      var wsum=0,ws=ps.map(function(c){var w=1+0.5*officeLvl(c.id);wsum+=w;return w;});
      var r2=Math.random()*wsum; from=ps[0];
      for(var q=0;q<ps.length;q++){ r2-=ws[q]; if(r2<=0){from=ps[q];break;} }
    }
  }
  if(!from && servedIds.length && Math.random()<0.6){
    var onNet=opnP[g].filter(function(c){return served[c.id];});
    from = onNet.length ? pick(onNet) : pick(opnP[g]);
  } else if(!from && !servedIds.length){
    // before you have anything, keep the offers close to the yard
    var near=opnP[g].filter(function(c){return km("duiven",c.id)<520;});
    from = near.length ? pick(near) : pick(opnP[g]);
  } else if(!from) from=pick(opnP[g]);
  // A city can only have so much freight standing on its dock. Once it is at
  // its own ceiling it offers nothing more until a truck clears some -- which
  // is what makes emptying a backlog worth doing, rather than the whole world
  // sharing one small pool.
  if(cityWaiting(from.id) >= cityCap(from)) return;
  // prefer a nearby consumer: real freight is mostly regional
  var cands=opnC[g].filter(function(c){return c.id!==from.id;});
  if(!cands.length) return;
  var scored=cands.map(function(c){
    var w=(c.size+1)/Math.pow(Math.max(120,km(from.id,c.id))/500,1.35);
    if(served[c.id]) w*=6;                         // pairs you can actually serve
    else if(!servedIds.length && km("duiven",c.id)>520) w*=0.25;
    w*=1+0.5*officeLvl(c.id);                      // a freight office pulls trade in
    return {c:c,w:w};
  });
  var tot=0; scored.forEach(function(s){tot+=s.w;});
  var r=Math.random()*tot, to=scored[0].c;
  for(var i=0;i<scored.length;i++){ r-=scored[i].w; if(r<=0){ to=scored[i].c; break; } }
  var d=km(from.id,to.id);
  var G=GOODS[g];
  var wt=Math.max(3, Math.round((4+Math.random()*22) * (G.t==="bulk"?1.5:G.t==="heavy"?1.1:1)));
  var pay=Math.round(d*wt*G.rate*0.115 + 160);
  // A window generous enough to be met by a decent network, tight enough that
  // one enormous loop cannot serve it.
  var drive=d/78;
  var due=S.t + drive*1.8 + 14 + Math.random()*16;
  S.loads.push({id:nextId++, g:g, from:from.id, to:to.id, w:wt, pay:pay, km:d,
                born:S.t, due:due, at:from.id, on:null, plan:null, step:0});
}

/* ============================================================ SERVICES
   A service is an ordered loop of stops with trucks assigned. Headway --
   how often a truck actually shows up -- is cycle time / trucks, and that
   single number is what makes a sprawling route useless.                  */
var SVC_COLORS=["#4fb4f5","#3ddb96","#c9a0ff","#ffb84d","#ff6e76","#4dd0d9","#ef9bd4","#b5e065"];
function newSvc(){
  var s={id:nextId++, n:"Service "+(S.svcs.length+1), stops:[],
         col:SVC_COLORS[S.svcs.length%SVC_COLORS.length]};
  S.svcs.push(s); return s;
}
function svcOf(id){ for(var i=0;i<S.svcs.length;i++) if(S.svcs[i].id===id) return S.svcs[i]; return null; }
function svcVehs(s){ return S.veh.filter(function(v){return v.svc===s.id;}); }
function legKm(s,i){ return km(s.stops[i], s.stops[(i+1)%s.stops.length]); }
function loopKm(s){ if(s.stops.length<2) return 0; var t=0; for(var i=0;i<s.stops.length;i++) t+=legKm(s,i); return t; }
// cycle time in hours for a given truck type, including dwell at every stop
function cycleH(s,type){
  if(s.stops.length<2) return 0;
  var T=TRUCKS[type==null?1:type], t=loopKm(s)/tSpeed(T.id);
  s.stops.forEach(function(id){ t+=dwellAt(id,type==null?1:type); });
  return t;
}
function svcCycle(s){
  var vs=svcVehs(s);
  if(!vs.length) return cycleH(s,1);
  var t=0; vs.forEach(function(v){ t+=cycleH(s,v.type); });
  return t/vs.length;
}
// plain-language read on a service: is it actually working, and specifically
// WHY not, when it isn't. `rate`/`earn`/`cost` are smoothed EUR/h whenever
// there is data to show, else null.
function svcVerdict(s){
  var vs=svcVehs(s);
  if(!s.stops||s.stops.length<2) return {cls:"bad",word:"No route",help:"Needs at least 2 stops.",rate:null,earn:null,cost:null};
  if(!vs.length) return {cls:"bad",word:"Idle",help:"No trucks assigned — nothing moves on this loop.",rate:null,earn:null,cost:null};
  var age=(S.svcActiveH&&S.svcActiveH[s.id])||0;
  var rate=S.svcEma?S.svcEma[s.id]:null;
  var earn=S.svcEarnEma?S.svcEarnEma[s.id]:null, cost=S.svcCostEma?S.svcCostEma[s.id]:null;
  // No verdict until at least one full round trip has had time to happen --
  // before that the line has paid wages and fuel but has not yet been paid for
  // anything, so any reading is guaranteed to look terrible and mean nothing.
  var warm=Math.max(8, svcCycle(s));
  if(age<warm||rate==null) return {cls:"warn",word:"Warming up",
    help:"Give it one full round trip ("+hrs(warm)+") before judging — it has paid wages and fuel but has not been paid for a delivery yet.",
    rate:null,earn:null,cost:null};
  if(!S.svcCls) S.svcCls={};
  var cls=classifyRate(rate, S.svcCls[s.id]);
  S.svcCls[s.id]=cls;
  if(cls==="good") return {cls:"good",word:"Profitable",help:"Earning "+eur(rate)+"/h more than it costs to run.",rate:rate,earn:earn,cost:cost};
  if(cls==="warn") return {cls:"warn",word:"Breaking even",
    help:"Earning "+eur(earn)+"/h against "+eur(cost)+"/h in costs — roughly covering itself. A little more freight on this loop would tip it into profit.",
    rate:rate,earn:earn,cost:cost};
  // losing money: work out which of the three real causes actually applies
  // here, instead of naming all of them and leaving the player to guess
  var wageOnly=vs.length*wageRate();
  var why;
  if(earn<8){
    why="This loop is carrying almost nothing — only "+eur(earn)+"/h in fees. These cities may not trade much "+
        "with each other. Check each city's Ships out / Takes in list, or extend the loop toward one that wants "+
        "what your stops produce.";
  }else if(vs.length>1){
    why=vs.length+" trucks are chasing "+eur(earn)+"/h of freight here — that is not enough to go round. "+
        "Remove a truck, or find this loop more freight, rather than adding more capacity.";
  }else if(cost-wageOnly>wageOnly && loopKm(s)>700){
    why="The loop itself is the cost: "+Math.round(loopKm(s))+"km round trip burns roughly "+
        eur(cost-wageOnly)+"/h in fuel alone. Shorten it, or hand the far leg to a second service "+
        "that meets this one partway, instead of running the whole distance yourself.";
  }else{
    why="Earning "+eur(earn)+"/h against "+eur(cost)+"/h in costs — close, but not quite covering itself yet. "+
        "A little more freight on this route would tip it into profit.";
  }
  return {cls:"bad",word:"Losing money",help:why,rate:rate,earn:earn,cost:cost};
}
// same idea as svcVerdict but for one truck -- what this specific vehicle is
// earning versus what it costs to keep on the road (wages + its own fuel burn)
function vehRate(v){
  if(!v.svc) return {cls:"warn",word:"Idle",rate:null};
  var age=(S.vehActiveH&&S.vehActiveH[v.id])||0;
  var rate=S.vehEma?S.vehEma[v.id]:null;
  var s=svcOf(v.svc);
  var warm=Math.max(8, s?svcCycle(s):8);
  if(age<warm||rate==null) return {cls:"warn",word:"Warming up",rate:null};
  var earn=S.vehEarnEma?S.vehEarnEma[v.id]:null, cost=S.vehCostEma?S.vehCostEma[v.id]:null;
  if(!S.vehCls) S.vehCls={};
  var cls=classifyRate(rate, S.vehCls[v.id]);
  S.vehCls[v.id]=cls;
  return {cls:cls, word:cls==="good"?"Profitable":cls==="warn"?"Breaking even":"Losing money",
          rate:rate, earn:earn, cost:cost};
}
// Is this line short of trucks, or short of freight? Both are fixable, but by
// opposite moves -- more vehicles versus a freight office, another stop, or
// different equipment -- and telling them apart from the profit figure alone
// is guesswork. This compares what the loop's trucks actually carry against
// what is standing at its stops waiting for them.
function svcSupply(s){
  var vs=svcVehs(s);
  if(!vs.length||s.stops.length<2) return null;
  var fill=(S.svcFillEma&&S.svcFillEma[s.id]);
  if(fill==null) return null;
  // freight standing at this loop's stops that these trucks could actually load
  var waitT=0, strandedT=0, strandedG={};
  s.stops.forEach(function(cid){
    S.loads.forEach(function(l){
      if(l.on||l.at!==cid) return;
      // only freight this loop could plausibly move: both ends on the loop.
      // Anything bound elsewhere is another service's business, not evidence
      // that this one is mis-equipped.
      if(s.stops.indexOf(l.to)<0) return;
      if(vs.some(function(v){ return vehTakes(v,l.g); })) waitT+=l.w;
      else { strandedT+=l.w; strandedG[l.g]=(strandedG[l.g]||0)+l.w; }
    });
  });
  var capT=0; vs.forEach(function(v){ capT+=tCap(v.type); });
  var pct=Math.round(fill*100), why, cls;
  // Primary read: are these trucks short of freight, or is the freight short
  // of trucks? Those need opposite fixes.
  if(waitT>capT*1.5){
    cls="warn";
    why="About "+Math.round(waitT)+"t is standing against "+capT+"t of capacity — well over what these trucks can lift "+
        "in one pass, and they are leaving "+pct+"% full. Another truck here would have freight waiting for it.";
  }else if(pct<45 && waitT<capT*0.5){
    cls="warn";
    why="Trucks leave only "+pct+"% full and just "+Math.round(waitT)+"t is waiting against "+capT+"t of capacity — "+
        "there is more truck here than freight. Build a freight office at a stop that ships, add a stop that ships "+
        "what these trucks carry, or move a truck to another loop.";
  }else{
    cls="good";
    why="Trucks leave about "+pct+"% full with roughly "+Math.round(waitT)+"t standing — capacity and freight are "+
        "reasonably matched on this loop.";
  }
  // Freight this loop generates that its current vehicles physically cannot
  // take is a separate problem with a separate fix, so it is called out
  // separately rather than replacing the headline.
  if(strandedT>Math.max(20,capT*0.35)){
    var gs=Object.keys(strandedG).sort(function(x,y){return strandedG[y]-strandedG[x];});
    var need={};
    gs.forEach(function(g){ var r=GOODS[g].req; if(r) need[r]=1; });
    var kit=Object.keys(need).map(function(r){
      return {reefer:"a reefer",tank:"a tanker",car:"a car transporter"}[r]; }).filter(Boolean);
    why+=" Separately, about "+Math.round(strandedT)+"t of "+
      gs.slice(0,3).map(function(g){return GOODS[g].n.toLowerCase();}).join(", ")+
      " is waiting that none of these vehicles can carry"+
      (kit.length? " — "+kit.join(" and ")+" on this loop would pick it up." : ".");
    if(cls==="good") cls="warn";
  }
  return {fillPct:pct, waitT:Math.round(waitT), strandedT:Math.round(strandedT), capT:capT, cls:cls, why:why};
}
function headway(s){
  var n=svcVehs(s).length;
  if(!n||s.stops.length<2) return Infinity;
  return svcCycle(s)/n;
}
// ride time from stop index i to stop index j, going forward around the loop
function rideH(s,i,j,type){
  var T=TRUCKS[type==null?1:type], t=0, n=s.stops.length, k=i;
  while(k!==j){ t+=km(s.stops[k],s.stops[(k+1)%n])/tSpeed(T.id) + dwellAt(s.stops[k],type==null?1:type); k=(k+1)%n; }
  return t;
}

/* ============================================================ ROUTER
   Dijkstra over cities. Boarding any service costs half its headway (the
   expected wait), which is exactly why coverage without frequency fails.  */
var routeCache={}, cacheKey=0;
function invalidate(){ routeCache={}; cacheKey++; }
function routePlan(fromId,toId,good){
  var req=(good&&GOODS[good]&&GOODS[good].req)||"";
  var ck=fromId+">"+toId+"|"+req;
  if(routeCache[ck]!==undefined) return routeCache[ck];
  // only services whose trucks carry this kind of freight are usable
  var live=S.svcs.filter(function(s){
    return s.stops.length>=2 && svcVehs(s).length>0 && (!req || svcCanCarry(s,good));
  });
  if(!live.length){ return (routeCache[ck]=null); }
  var dist={}, prev={}, done={};
  dist[fromId]=0;
  var guard=0;
  while(guard++<400){
    var u=null,best=Infinity;
    for(var k in dist){ if(!done[k]&&dist[k]<best){best=dist[k];u=k;} }
    if(u===null) break;
    if(u===toId) break;
    done[u]=true;
    live.forEach(function(s){
      var i=s.stops.indexOf(u); if(i<0) return;
      var wait=headway(s)/2;
      for(var n=1;n<s.stops.length;n++){
        var j=(i+n)%s.stops.length, v=s.stops[j];
        var cost=dist[u]+wait+rideH(s,i,j,null);
        if(dist[v]===undefined||cost<dist[v]){ dist[v]=cost; prev[v]={from:u,svc:s.id,i:i,j:j}; }
      }
    });
  }
  if(dist[toId]===undefined){ return (routeCache[ck]=null); }
  var legs=[],cur=toId;
  while(cur!==fromId){
    var p=prev[cur]; if(!p) return (routeCache[ck]=null);
    legs.unshift({svc:p.svc, from:p.from, to:cur});
    cur=p.from;
  }
  // collapse consecutive legs on the same service into one ride
  var merged=[];
  legs.forEach(function(l){
    var last=merged[merged.length-1];
    if(last&&last.svc===l.svc) last.to=l.to; else merged.push({svc:l.svc,from:l.from,to:l.to});
  });
  var plan={legs:merged, hours:dist[toId]};
  return (routeCache[ck]=plan);
}
function planFor(load){
  return routePlan(load.at||load.from, load.to, load.g);
}

  var r=GOODS[load.g]&&GOODS[load.g].req;
  if(!r) return false;
  return !S.veh.some(function(v){ return TRUCKS[v.type].spec===r; });
}

  // hit: anything inside a drawn pin wins outright, and only if the tap landed
  // on bare map do we widen to the surrounding margin.
  var best=null, bd=Infinity, near=null, nd=Infinity, k=pinK();
  CITIES.forEach(function(c){
    var d=Math.hypot(c.x-wx,c.y-wy), r=padR(c)*k;
    if(d<=r){ if(d<bd){ bd=d; best=c; } }
    else if(d<=r+11/cam.s && d<nd){ nd=d; near=c; }
  });
  if(!best) best=near;
  if(!best){
    // no city under the tap -- maybe a route line was tapped instead. Not
    // while actively editing a (possibly different) service, since taps
    // there are already spoken for by the route-building gesture below.
    if(!(tab==="services"&&svcEdit!=null)){
      var hitSvc=hitSvcLine(wx,wy);
      if(hitSvc){ svcEdit=hitSvc.id; setTab("services"); render(); }
    }
    return;
  }
  // editing a service: tapping the map IS building the route -- tap a new
  // city to append it, tap one already on the loop to drop it. This is the
  // whole point of showing the map at all instead of just a text list.
  if(tab==="services"&&svcEdit!=null){
    var s=svcOf(svcEdit); if(!s) return;
    var idx=s.stops.indexOf(best.id);
    if(idx>=0){ s.stops.splice(idx,1); afterEdit(s); return; }
    if(cityLocked(best.id)){
      toast("🔒 <b>"+best.n+"</b> is locked — unlock it in the City tab for "+eur(unlockCost(best))+".");
      selCity=best.id; return;
    }
    s.stops.push(best.id);
    afterEdit(s);
    return;
  }
  selCity=best.id; setTab("city"); refreshCities();
}

function planLine(l){
  var p = l.plan || planFor(l);
  if(!p){
    var r=GOODS[l.g]&&GOODS[l.g].req;
    if(r&&lacksEquipment(l)){
      var need={reefer:"a reefer",tank:"a tanker",car:"a car transporter"}[r];
      return {cls:"none", html:"<b>You own no "+need.replace(/^an? /,"")+"</b> — "+GOODS[l.g].n.toLowerCase()+
        " can only ride "+need+". Buy one in Fleet."};
    }
    if(r) return {cls:"none", html:"<b>No "+r+" service</b> — put "+
      ({reefer:"a reefer",tank:"a tanker",car:"a transporter"}[r])+" on a service that links "+
      CITY[l.from].n+" and "+CITY[l.to].n+"."};
    if(cityLocked(l.to)) return {cls:"none", html:"<b>🔒 "+CITY[l.to].n+" is locked</b> — unlock it for "+
      eur(unlockCost(CITY[l.to]))+" in the City tab, then build a route there."};
    if(cityLocked(l.from)) return {cls:"none", html:"<b>🔒 "+CITY[l.from].n+" is locked</b> — unlock it for "+
      eur(unlockCost(CITY[l.from]))+" in the City tab to collect this."};
    return {cls:"none", html:"<b>No route</b> — nothing you have built reaches "+CITY[l.to].n+"."};
  }
  var eta=S.t+p.hours, slack=l.due-eta;
  var cls = slack<0 ? "late" : slack<6 ? "tight" : "ok";
  var parts=p.legs.map(function(lg,i){
    var s=svcOf(lg.svc);

  }).join("");

              : '<b style="color:'+(slack<6?'var(--amber)':'var(--green)')+'">'+hrs(slack)+' to spare</b>';
  return {cls:cls, html: parts+'<span class="leg" style="margin-top:3px">≈'+hrs(p.hours)+

// Pointer-based drag reordering for the stop list -- works with touch as well
// as mouse, unlike HTML5 drag-and-drop. The dragged row follows the pointer
// directly; the rows it passes over slide aside to show where it will land.
// The array itself is only spliced once, on release.
function makeStopsDraggable(wrapS,s){
  var rows=Array.prototype.slice.call(wrapS.querySelectorAll(".stop"));
  if(rows.length<2) return;
  rows.forEach(function(row,dragIdx){
    var h=row.querySelector(".draghandle");
    if(!h) return;
    h.addEventListener("pointerdown",function(e){
      e.preventDefault();
      var startY=e.clientY, target=dragIdx;
      row.classList.add("dragging");
      // Rows are not all the same height -- a stop with a long "ships ..." line
      // wraps -- so work out where the drag has landed by comparing the dragged
      // row's centre against each row's own centre, rather than assuming a
      // uniform row pitch.
      var mids=rows.map(function(r){ var b=r.getBoundingClientRect(); return b.top+b.height/2; });
      function move(ev){
        var dy=ev.clientY-startY;
        row.style.transform="translateY("+dy+"px)";
        var c=mids[dragIdx]+dy;
        target=dragIdx;
        for(var t=0;t<rows.length;t++){
          if(t<dragIdx && c<mids[t]){ target=t; break; }
          if(t>dragIdx && c>mids[t]) target=t;
        }
        var rh=row.getBoundingClientRect().height;
        rows.forEach(function(r,ri){
          if(r===row) return;
          var shift=0;
          if(target>dragIdx && ri>dragIdx && ri<=target) shift=-rh;
          else if(target<dragIdx && ri>=target && ri<dragIdx) shift=rh;
          r.style.transform=shift?"translateY("+shift+"px)":"";
        });
      }
      function up(){
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
        window.removeEventListener("pointercancel",up);
        if(target!==dragIdx){
          var id=s.stops.splice(dragIdx,1)[0];
          s.stops.splice(target,0,id);
          afterEdit(s);
        }else{
          row.classList.remove("dragging"); row.style.transform="";
          rows.forEach(function(r){ r.style.transform=""; });
        }
      }
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up);
      window.addEventListener("pointercancel",up);
    });
  });
}

  lab2.textContent="Add a stop · "+avail.length+" cities, nearest to "+last.n+" first";

  if(lockedNearby){
    var lockhint=document.createElement("div"); lockhint.className="empty"; lockhint.style.padding="7px 12px";
    lockhint.style.marginBottom="7px"; lockhint.style.fontSize="11.5px"; lockhint.style.textAlign="left";
    lockhint.innerHTML="🔒 "+lockedNearby+" more cities exist but are not unlocked yet. Tap a locked pin "+

    "color:var(--ink);padding:8px 10px;margin-bottom:7px;font-size:12px";

function renderStopList(list,s,avail,last){
  list.innerHTML="";
  var q=stopFilter.trim().toLowerCase();
  var rows=avail.filter(function(c){
    if(!q) return true;
    return c.n.toLowerCase().indexOf(q)>=0 || cname(c.c).toLowerCase().indexOf(q)>=0 ||
           (c.out||[]).some(function(g){return GOODS[g].n.toLowerCase().indexOf(q)>=0;});
  });
  if(!rows.length){ list.innerHTML='<div class="sub" style="padding:4px 2px">No city matches that.</div>'; return; }
  rows.forEach(function(c){
    var d=document.createElement("div"); d.className="card"; d.style.padding="7px 9px";
    d.innerHTML='<div class="row"><div class="grow"><div class="ttl" style="font-size:12px">'+flag(c.c)+' '+c.n+
      '</div><div class="sub">'+cname(c.c)+' · '+km(last.id,c.id)+'km from '+last.n+
      (c.out&&c.out.length?' · ships '+c.out.slice(0,2).map(function(g){return GOODS[g].n.toLowerCase();}).join(", "):'')+
      '</div></div><button class="btn sm">＋</button></div>';

function renderSvcTrucks(b,s){
  var vs=svcVehs(s);

    n.textContent="None. Assign at least one or nothing moves."; b.appendChild(n); }

    d.innerHTML='<div class="row"><div class="grow"><div class="ttl" style="font-size:12px">'+T.n+'</div>'+
      '<div class="sub">'+vehLoad(v)+'/'+T.cap+'t · → '+(s.stops[v.si]?CITY[s.stops[v.si]].n:'?')+'</div></div>'+
      '<button class="btn ghost sm">Remove</button></div>';
    d.querySelector("button").onclick=function(){ unassign(v); afterEdit(s); };
    b.appendChild(d);
  });
  var free=S.veh.filter(function(v){return !v.svc;});
  if(free.length&&s.stops.length>=2){
    var lab4=document.createElement("div"); lab4.className="lbl"; lab4.textContent="Idle in the yard";
    b.appendChild(lab4);
    free.forEach(function(v){
      var T=TRUCKS[v.type], ok=vehCanServe(v.type,s);

      d.innerHTML='<div class="row"><div class="grow"><div class="ttl" style="font-size:12px">'+T.n+'</div>'+

function afterEdit(s){ svcVehs(s).forEach(function(v){ if(v.si>=s.stops.length) v.si=0; });
  invalidate(); drawSvcs(); refreshCities(); render(); }

function renderFleet(b){
  b.innerHTML="";
  $("bFleet").textContent=S.veh.length;
  var lab=document.createElement("div"); lab.className="lbl"; lab.textContent="Your trucks ("+S.veh.length+")";
  b.appendChild(lab);
  if(!S.veh.length){ var e=document.createElement("div"); e.className="sub"; e.style.padding="0 2px 8px";
    e.textContent="No trucks. Buy one below."; b.appendChild(e); }
  var PCLS3={good:"g",warn:"a",bad:"r"};
  S.veh.forEach(function(v){
    var T=TRUCKS[v.type], s=v.svc?svcOf(v.svc):null, vr=vehRate(v);
    var d=document.createElement("div"); d.className="card";
    // Where it actually is right now, in plain terms: parked at a named stop
    // (loading, or holding out for more), or moving between two named stops --
    // not just "→ next stop", which reads the same whether it is sitting there
    // or already gone.
    var fillPct=s?Math.round(100*vehLoad(v)/T.cap):0;
    var locHtml="";
    if(s){
      if(v.dwell>0){
        var here=CITY[s.stops[v.si]].n;
        locHtml=v.waiting
          ? 'Holding for more freight at <b>'+here+'</b>'
          : 'At <b>'+here+'</b> · loading';
      } else {
        var from=CITY[s.stops[(v.si-1+s.stops.length)%s.stops.length]].n, to=CITY[s.stops[v.si]].n;
        locHtml='En route to <b>'+to+'</b> <span class="sub">(from '+from+')</span>';
      }
    }
    d.innerHTML='<div class="row"><div class="grow"><div class="ttl">'+T.n+
      (s?' <span class="pill" style="background:'+s.col+'22;color:'+s.col+'">'+s.n+'</span>'
        :' <span class="pill">idle</span>')+'</div>'+
      '<div class="sub">'+(s? vehLoad(v)+'/'+T.cap+'t aboard ('+fillPct+'% full) · '+locHtml
        : T.cap+'t · parked at Duiven')+'</div>'+
      (s?'<div class="sub" style="margin-top:3px"><span class="pill '+PCLS3[vr.cls]+'" style="font-size:10px">'+vr.word+'</span>'+
        (vr.rate!=null?' <span class="vrate '+vr.cls+'" style="font-size:11px">'+(vr.rate>=0?"+":"−")+eur(Math.abs(vr.rate))+'/h</span>':'')+
        (v.waiting
          ? ' <span class="sub">· gives up and leaves as-is in '+hrs(Math.max(0,STALL_GIVEUP-(v.sinceGain||0)))+
            ' if nothing new turns up</span>'+
            ' <button class="btn sm" id="go-'+v.id+'" style="margin-left:6px;padding:2px 8px;font-size:11px">Depart now</button>'
          : '')+
        '</div>':'')+
      '<div class="cargo"></div>'+
      '<div class="vopt"></div>'+
      '</div></div>';
    // What it's actually carrying right now, and -- while it's stopped
    // somewhere -- a way to set any one piece of it back down. Switching what
    // a truck picks up (below) only changes future pickups; it never touches
    // cargo already aboard, so this is how you get rid of something that no
    // longer matches without waiting for it to reach its own destination.
    var cargoEl=d.querySelector(".cargo");
    if(s&&v.cargo&&v.cargo.length){
      var canDrop=v.dwell>0;
      cargoEl.innerHTML='<div class="optrow">'+v.cargo.map(function(l,i){
        var label=GOODS[l.g].ic+' '+l.w+'t → '+CITY[l.to].n;
        return canDrop
          ? '<button class="optb" data-unload="'+i+'" title="Set this down here instead of carrying it on">'+label+' ✕</button>'
          : '<span class="good">'+label+'</span>';
      }).join("")+'</div>';
      if(canDrop) cargoEl.querySelectorAll("[data-unload]").forEach(function(bt){
        bt.onclick=function(){
          var idx=parseInt(bt.getAttribute("data-unload"),10);
          var l=v.cargo[idx];
          if(l&&unloadCargo(v,idx)){ toast("Left "+GOODS[l.g].n.toLowerCase()+" at "+CITY[v.at].n+"."); render(); }
        };
      });
    } else if(s){
      cargoEl.innerHTML='<div class="sub" style="color:#7f8b99">Running empty right now.</div>';
    }
    // Load rules: how full it insists on being before it leaves, and whether
    // it holds out for one kind of freight.
    var opt=d.querySelector(".vopt");
    var carriable=Object.keys(GOODS).filter(function(g){ return truckCan(v.type,g); });
    opt.innerHTML='<div class="optrow"><span class="optk">Leaves when</span>'+
      FILL_OPTS.map(function(o){ return '<button class="optb'+(vFill(v)===o.v?' on':'')+
        '" data-fill="'+o.v+'">'+o.n+'</button>'; }).join("")+'</div>'+
      '<div class="optrow"><span class="optk">Picks up</span>'+
      '<button class="optb'+(vPick(v)==="all"?' on':'')+'" data-pick="all">All</button>'+
      carriable.map(function(g){ return '<button class="optb'+(vPick(v)===g?' on':'')+
        '" data-pick="'+g+'" title="'+GOODS[g].n+'">'+GOODS[g].ic+'</button>'; }).join("")+'</div>'+
      '<div class="sub" style="margin-top:2px;color:#7f8b99">Only changes what it picks up next — anything already '+
      'aboard rides along as normal. Set it down early with the ✕ above, next time it\'s stopped somewhere.</div>'+
      (vFill(v)? '<div class="sub" style="margin-top:4px;color:#7f8b99">Waits as long as it takes to reach '+
        Math.round(vFill(v)*100)+'% full ('+Math.ceil(tCap(v.type)*vFill(v))+'t), and <b style="color:var(--green)">'+
        'draws no wages while it waits</b> — a parked trailer is not a driver on the clock. Moves on if the stop '+
        'has nothing left it can load.</div>'
        : '<div class="sub" style="margin-top:4px;color:#7f8b99">Takes whatever is ready and leaves straight away. '+
          'Most trips, most freight moved — at the cost of running part loaded.</div>');
    opt.querySelectorAll("[data-fill]").forEach(function(bt){
      bt.onclick=function(){ v.minFill=parseFloat(bt.getAttribute("data-fill")); v.held=0; v.sinceGain=0; render(); };
    });
    opt.querySelectorAll("[data-pick]").forEach(function(bt){
      bt.onclick=function(){ v.pickG=bt.getAttribute("data-pick"); v.held=0; v.sinceGain=0; render(); };
    });
    var goBtn=d.querySelector("#go-"+v.id);
    if(goBtn) goBtn.onclick=function(){ v.forceGo=true; toast(T.n+" told to leave with whatever it has."); render(); };
    b.appendChild(d);
  });
  var lab2=document.createElement("div"); lab2.className="lbl"; lab2.textContent="Buy";
  b.appendChild(lab2);
  TRUCKS.forEach(function(T){
    var locked=S.level<T.lvl, ok=S.cash>=T.cost&&!locked;
    var d=document.createElement("div"); d.className="card";
    d.innerHTML='<div class="row"><div class="gtile">'+T.ic+'</div><div class="grow">'+
      '<div class="ttl">'+T.n+(T.spec?' <span class="pill b">'+
        ({reefer:"food only",tank:"chemicals only",car:"cars only"}[T.spec])+'</span>':'')+'</div>'+
      '<div class="sub">'+tCap(T.id)+'t · '+Math.round(tSpeed(T.id))+' km/h · '+T.dwell.toFixed(2)+'h per stop</div>'+
      '<div class="sub" style="color:#7f8b99">'+T.note+'</div></div>'+
      (locked?'<span class="lock">level '+T.lvl+'</span>':
        '<button class="btn sm" '+(ok?'':'disabled')+'>'+eur(T.cost)+'</button>')+'</div>';
    var bt=d.querySelector("button");
    if(bt) bt.onclick=function(){ if(buyTruck(T.id)){ toast("Bought a "+T.n+"."); render(); } };
    b.appendChild(d);
  });
}

// What is actually sitting on the dock at a city, waiting for a truck. Without
// this you can see that a city has freight only as a number on its map pin,
// with no way to find out what it is, where it wants to go, or why it is stuck.
function waitingHtml(c){
  if(cityLocked(c.id)) return "";
  var here=S.loads.filter(function(l){ return !l.on && l.at===c.id; })
    .sort(function(x,y){ return (x.due-S.t)-(y.due-S.t); });
  var h='<div class="lbl">Waiting here · '+here.length+' load'+(here.length===1?'':'s')+'</div>';
  if(!here.length){
    return h+'<div class="sub" style="padding:0 2px 6px">'+(servedCities()[c.id]
      ? 'Nothing waiting — your trucks are keeping up here.'
      : 'Nothing yet. Freight builds up at cities your services actually call at.')+'</div>';
  }
  here.slice(0,10).forEach(function(l){
    var pl=planLine(l), slack=l.due-S.t;
    h+='<div class="card" style="padding:7px 9px"><div class="row">'+
      '<div class="gtile" style="width:30px;height:30px;font-size:15px">'+GOODS[l.g].ic+'</div>'+
      '<div class="grow"><div class="ttl" style="font-size:12px">'+GOODS[l.g].n+
      ' <span class="sub">'+l.w+'t</span>'+
      '<span class="mono" style="float:right;color:var(--green)">'+eur(l.pay)+'</span></div>'+
      '<div class="sub">→ '+flag(CITY[l.to].c)+' '+CITY[l.to].n+' · <span style="color:'+
      (slack<0?'var(--red)':slack<6?'var(--amber)':'var(--dim2)')+'">'+
      (slack<0?hrs(-slack)+' overdue':hrs(slack)+' left')+'</span></div>'+
      '<div class="sub" style="margin-top:2px">'+pl.html+'</div></div></div></div>';
  });
  if(here.length>10) h+='<div class="sub" style="padding:2px">…and '+(here.length-10)+' more.</div>';
  return h;
}
function renderCity(b){
  b.innerHTML="";
  if(!selCity){ b.innerHTML='<div class="empty">Tap a city on the map to see what it makes, what it needs, and your history with it.</div>'; return; }
  var c=CITY[selCity], h=hist(c.id);
  var served=servedCities()[c.id];
  var out=(c.out||[]).map(function(g){return '<span class="good out">'+GOODS[g].ic+' '+GOODS[g].n+'</span>';}).join("")||
    '<span class="sub">nothing — this is a <b style="color:var(--green)">destination</b>, and you get paid to deliver into it. '+
    'Every profitable loop needs at least one.</span>';
  var inn=(c.in||[]).map(function(g){return '<span class="good in">'+GOODS[g].ic+' '+GOODS[g].n+'</span>';}).join("")||'<span class="sub">nothing</span>';
  // who this city naturally trades with -- the corridors worth building
  var partners=[];
  (c.out||[]).forEach(function(g){ CONSUMERS[g].forEach(function(o){ if(o.id!==c.id)
    partners.push({id:o.id,g:g,d:km(c.id,o.id),dir:"to"}); }); });
  (c.in||[]).forEach(function(g){ PRODUCERS[g].forEach(function(o){ if(o.id!==c.id)
    partners.push({id:o.id,g:g,d:km(c.id,o.id),dir:"from"}); }); });
  partners.sort(function(a,b2){ return a.d-b2.d; });
  var seen={}, plist=[];
  partners.forEach(function(p){ var k=p.dir+p.id+p.g; if(seen[k])return; seen[k]=1; if(plist.length<6) plist.push(p); });

  var locked=cityLocked(c.id);
  var status=locked?' · <span style="color:var(--amber)">🔒 locked</span>':
    (served?' · <span style="color:var(--green)">on your network</span>':' · <span style="color:var(--dim2)">not served</span>');
  b.innerHTML=
    '<div class="card"><div class="row"><div style="font-size:30px">'+flag(c.c)+'</div>'+
    '<div class="grow"><div class="ttl" style="font-size:17px">'+c.n+'</div>'+
    '<div class="sub">'+cname(c.c)+(c.port?' · seaport':'')+(c.air?' · air hub':'')+(c.capital?' · capital':'')+
    status+'</div></div></div>'+

    '<div class="kv"><div class="k">Ships out</div><div class="v"><div class="goods">'+out+'</div></div></div>'+
    '<div class="kv"><div class="k">Takes in</div><div class="v"><div class="goods">'+inn+'</div></div></div>'+
    waitingHtml(c)+
    '<div class="kv"><div class="k">Trades with</div><div class="v">'+
      (plist.map(function(p){ return (p.dir==="to"?"→ ":"← ")+CITY[p.id].n+' <span class="sub">('+
        GOODS[p.g].n.toLowerCase()+', '+p.d+'km)</span>'; }).join("<br>")||"—")+'</div></div>'+
    (locked?
    '<div class="lbl">Unlock this city</div>'+
    '<div class="card"><div class="row"><div class="grow"><div class="ttl">'+c.n+' is not on your map yet</div>'+
      '<div class="sub">Nothing you own can stop here or add it to a service until you unlock it. Cost drops '+
      'the closer it is to a city you already run — grow outward from your network.</div></div>'+
      '<button class="btn sm" id="buyUnlock" '+(S.cash>=unlockCost(c)?'':'disabled')+'>'+eur(unlockCost(c))+'</button>'+
      '</div></div>':
    '<div class="lbl">Invest here</div>'+
    '<div class="sub" style="margin:-2px 2px 8px;color:#7f8b99">Your own buildings on this city\'s ground — '+
    'they speed up and win work for every service that calls here.</div>'+
    '<div class="card"><div class="row"><div class="grow"><div class="ttl">Depot '+
      (depotLvl(c.id)?'<span class="pill a">level '+depotLvl(c.id)+'</span>':'')+'</div>'+
      '<div class="sub">Faster turnarounds: −22% time in the yard per level. Shorter cycles mean '+

      '</div></div>'+(depotLvl(c.id)>=3?'<span class="pill">max</span>':

    '<div class="card"><div class="row"><div class="grow"><div class="ttl">Freight office '+
      (officeLvl(c.id)?'<span class="pill a">level '+officeLvl(c.id)+'</span>':'')+'</div>'+
      '<div class="sub">Wins you more business here: +50% of the freight offered at this city per level.'+

      '</svg>'+
      '<div class="sub" style="display:flex;justify-content:space-between;margin-top:2px">'+
      '<span>'+eur(S.cash)+' now</span></div>';
  }
  b.appendChild(perf);

  // Projects: paid for in delivered freight rather than cash, so they are the
  // one thing that makes a *specific* corridor worth building.
  var lp=document.createElement("div"); lp.className="lbl";
  lp.textContent="Projects · built with freight, not cash"; b.appendChild(lp);
  PROJECTS.forEach(function(p){
    var done=projDone(p.id), host=CITY[p.at], locked=cityLocked(p.at);
    var d=document.createElement("div"); d.className="card";
    var rows=Object.keys(p.need).map(function(g){
      var got=projGot(p.id,g), want=p.need[g], pct=Math.min(100,100*got/want);
      return '<div style="margin-top:5px"><div class="sub">'+GOODS[g].ic+' '+GOODS[g].n+
        ' <span class="mono" style="float:right;color:'+(got>=want?'var(--green)':'var(--dim2)')+'">'+
        Math.floor(got)+'/'+want+'t</span></div>'+
        '<div class="achbar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>';
    }).join("");
    d.innerHTML='<div class="row"><div class="gtile">'+p.ic+'</div><div class="grow">'+
      '<div class="ttl">'+p.n+(done?' <span class="pill g">built</span>':'')+'</div>'+
      '<div class="sub">Deliver into '+flag(host.c)+' <b style="color:var(--ink)">'+host.n+'</b>'+
      (locked?' <span style="color:var(--amber)">· 🔒 city still locked</span>':'')+'</div>'+
      '<div class="sub" style="color:#7f8b99;margin-top:3px">'+p.d+'</div>'+
      '<div class="sub" style="color:var(--green);margin-top:3px">🎁 '+p.r+'</div>'+
      '</div></div>'+(done?"":rows);
    b.appendChild(d);
  });

  var l1=document.createElement("div"); l1.className="lbl"; l1.textContent="Upgrades"; b.appendChild(l1);
  UPG.forEach(function(u){
    var lv=up(u.id), maxed=lv>=u.max, locked=S.level<u.lvl, cost=upCost(u);
    var d=document.createElement("div"); d.className="card";
    d.innerHTML='<div class="row"><div class="gtile">'+u.ic+'</div><div class="grow">'+
      '<div class="ttl">'+u.n+(lv?' <span class="pill a">lvl '+lv+'/'+u.max+'</span>':'')+'</div>'+
      '<div class="sub">'+u.d+'</div></div>'+
      (maxed?'<span class="pill g">maxed</span>':
       locked?'<span class="lock">level '+u.lvl+'</span>':
       '<button class="btn sm" '+(S.cash>=cost?'':'disabled')+'>'+eur(cost)+'</button>')+'</div>';
    var bt=d.querySelector("button");
    if(bt) bt.onclick=function(){ if(buyUpg(u)){ toast(u.ic+" <b>"+u.n+"</b> upgraded."); render(); } };
    b.appendChild(d);
  });

  var l2=document.createElement("div"); l2.className="lbl"; l2.textContent="Trophies "+done+"/"+ACH.length;
  b.appendChild(l2);
  ACH.slice().sort(function(x,y){ var gx=S.ach&&S.ach[x.id]?0:1, gy=S.ach&&S.ach[y.id]?0:1;
    return gx-gy; }).forEach(function(a2){
    var got=S.ach&&S.ach[a2.id];
    var d=document.createElement("div"); d.className="ach"+(got?" got":"");
    var barHtml="";
    if(!got&&a2.p){
      var pr; try{ pr=a2.p(); }catch(e){ pr=null; }
      if(pr){
        var cur=pr[0], tgt=pr[1], pct=Math.max(0,Math.min(100,100*cur/tgt));
        var curT=a2.fmt==="eur"?eur(cur):Math.round(cur).toLocaleString();
        var tgtT=a2.fmt==="eur"?eur(tgt):Math.round(tgt).toLocaleString();
        barHtml='<div class="achbar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'+
          '<div class="achp">'+curT+' / '+tgtT+'</div>';
      }
    }
    d.innerHTML='<div class="ai">'+a2.ic+'</div><div class="grow"><div class="an">'+a2.n+'</div>'+
      '<div class="ad">'+a2.d+'</div>'+barHtml+'</div><div class="ar">'+(got?"✓ ":"")+eur(a2.r)+'</div>';
    b.appendChild(d);
  });
}
function render(){
  var b=$("tabbody");
  if(tab==="loads") renderLoads(b);
  else if(tab==="services") renderServices(b);
  else if(tab==="fleet") renderFleet(b);
  else if(tab==="co") renderCo(b);
  else renderCity(b);
  updateHeader();
  $("bSvc").textContent=S.svcs.length; $("bFleet").textContent=S.veh.length;
}
// The header must keep ticking even while a panel is being edited -- otherwise
// cash freezes and the game looks like it has stopped.
function updateHeader(){
  $("hCash").textContent=eur(S.cash);
  var netEl=$("hNet");
  if(S.netEma==null){ netEl.textContent="—"; netEl.className="v"; }
  else{
    var n=Math.round(S.netEma);
    netEl.textContent=(n>=0?"+":"−")+eur(Math.abs(n))+"/h";
    netEl.className="v "+(n>10?"ok":n<-10?"bad":"warn2");
  }
  $("hLvl").textContent=S.level;
  $("hXp").style.width=Math.min(100,100*(S.xp/xpNeed(S.level)))+"%";
  var gotN=ACH.filter(function(a){return S.ach&&S.ach[a.id];}).length;
  var ab=$("bAch"); if(ab) ab.textContent=gotN+"/"+ACH.length;
  var ot=Math.round(repScore()*100);
  var e=$("hOnTime"); e.textContent=(S.recent&&S.recent.length)?ot+"%":"—";
  e.className="v "+(ot<75?"bad":"ok");
}

var guidePage=0;
function showGuide(n){
  guidePage=Math.max(0,Math.min(GUIDE.length-1,n));
  var g=GUIDE[guidePage];
  var dots=GUIDE.map(function(_,i){return '<i class="gd'+(i===guidePage?" on":"")+'"></i>';}).join("");
  openModal(g.t,
    '<div class="gbody">'+g.h+'</div>'+
    '<div class="gnav"><button class="btn ghost sm" id="gPrev"'+(guidePage?'':' disabled')+'>‹ Back</button>'+
    '<div class="gdots">'+dots+'</div>'+
    '<button class="btn sm" id="gNext">'+(guidePage===GUIDE.length-1?"Start":"Next ›")+'</button></div>');
  $("gPrev").onclick=function(){ showGuide(guidePage-1); };
  $("gNext").onclick=function(){
    if(guidePage===GUIDE.length-1){ $("modal").classList.remove("show"); try{localStorage.setItem("lh-seen-guide","1");}catch(e){} }
    else showGuide(guidePage+1);
  };
}
$("btnHelp").onclick=function(){ showGuide(0); };
function oldHelp(){
  openModal("How this works",
   "<h3>You design services, not deliveries</h3><p>A <em>service</em> is a standing loop of cities. Trucks assigned to it drive that loop for ever. Freight rides whatever chain of services gets it from its origin to its destination — changing between services at shared cities if it has to.</p>"+
   "<h3>Frequency beats coverage</h3><p>The number that matters is <em>how often a truck comes round</em>: round-trip time divided by trucks. On a giant loop through everywhere, a load waits ages to be collected and then rides most of the way around to arrive. It misses its window and you are paid a third.</p><p>Short, dense services with transfers at a hub beat one grand tour almost every time. That is why real freight runs through Rotterdam and Duisburg rather than city to city.</p>"+

   "<h3>The map teaches itself</h3><p>Cities make and need real things. Prato spins cloth, Milano turns it into fashion. Ore lands at Rotterdam, becomes steel at Duisburg, becomes cars at Wolfsburg, and leaves through Bremen. Build the corridors that pay and you will end up knowing the map without ever being tested on it.</p>"+

/* ============================================================ LOOP */
var speeds=[1,3,8], si=0;
$("btnSpeed").onclick=function(){ si=(si+1)%speeds.length; S.speed=speeds[si];
  $("btnSpeed").textContent="▶ "+S.speed+"×"; };

var lastT=performance.now(), spawnAcc=0, uiAcc=0, panelAcc=0;
var HOURS_PER_SEC=0.55;
function frame(now){
  var dtReal=Math.min(0.1,(now-lastT)/1000); lastT=now;
  var dt=dtReal*HOURS_PER_SEC*S.speed;
  step(dt);
  spawnAcc+=dt;
  // reputation throttles how much business you are offered
  var every = 0.85 / ((0.25+0.75*repScore())*(1+0.12*up("sales"))*(1+0.20*projPerk("volume")));
  while(spawnAcc>=every){ spawnAcc-=every; spawnLoad(); }
  drawVehs();
  uiAcc+=dtReal;
  if(uiAcc>0.25){ uiAcc=0; updateHeader(); checkAch(); renderNextStep(); }
  panelAcc+=dtReal;
  if(panelAcc>0.7){ panelAcc=0;
    if(!(tab==="services"&&svcEdit!=null)) render();
    refreshCities(); refreshSvcHealth(); }
  requestAnimationFrame(frame);
}

/* ============================================================ SAVE
   Progression is meaningless if a refresh wipes it. Services, trucks and
   everything bought are stored; freight in flight is not, since it is
   regenerated within moments anyway.                                       */
var SAVE_KEY="linehaul-network-v1";
function serialise(){
  return {v:1, cash:S.cash, t:S.t, xp:S.xp, level:S.level, upg:S.upg, ach:S.ach, chain:S.chain,
    depot:S.depot, office:S.office, hist:S.hist, recent:S.recent, unlocked:S.unlocked, stepsDone:S.stepsDone, proj:S.proj, projDone:S.projDone,
    netHist:S.netHist, histStep:S.histStep, lastHistT:S.lastHistT,
    delivered:S.delivered, late:S.late, earned:S.earned, cancelled:S.cancelled,
    fuel:S.fuel, wages:S.wages, spent:S.spent,
    svcs:S.svcs.map(function(x){return {id:x.id,n:x.n,stops:x.stops,col:x.col};}),
    veh:S.veh.map(function(v){return {type:v.type,svc:v.svc,si:v.si,minFill:v.minFill,pickG:v.pickG};}),
    nextId:nextId, saved:Date.now()};
}
// Set while a reset is in flight so the beforeunload/visibilitychange
// autosave handlers below don't immediately write the old, pre-reset state
// straight back to localStorage during the reload that follows.
var resetting=false;
function saveGame(){ if(resetting) return; try{ localStorage.setItem(SAVE_KEY, JSON.stringify(serialise())); }catch(e){} }
function loadGame(){
  var raw=null; try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return false;
  var d=null; try{ d=JSON.parse(raw); }catch(e){ return false; }
  if(!d||d.v!==1) return false;
  S=fresh();
  ["cash","t","xp","level","upg","ach","chain","depot","office","hist","recent",
   "delivered","late","earned","cancelled","fuel","wages","spent","stepsDone","proj","projDone",
   "netHist","histStep","lastHistT"].forEach(function(k){
    if(d[k]!==undefined&&d[k]!==null) S[k]=d[k];
  });
  // saves from before city unlocking existed have no `unlocked` field -- grandfather
  // those players into full access rather than retroactively locking a network
  // they already built.
  if(d.unlocked&&typeof d.unlocked==="object") S.unlocked=d.unlocked;
  else { var allOpen={}; CITIES.forEach(function(c){ allOpen[c.id]=1; }); S.unlocked=allOpen; }
  nextId=Math.max(nextId, d.nextId||1);
  S.svcs=(d.svcs||[]).map(function(x){
    return {id:x.id,n:x.n,col:x.col,stops:(x.stops||[]).filter(function(id){return CITY[id];})};
  });
  S.veh=(d.veh||[]).map(function(v){
    var home=CITY.duiven;
    return {id:nextId++, type:v.type, svc:v.svc, si:v.si||0, prog:0, dwell:0,
            minFill:(v.minFill==null?1:v.minFill), pickG:v.pickG||"all", held:0,
            x:home.x, y:home.y, at:"duiven", cargo:[]};
  });
  // put each truck back on its loop
  S.veh.forEach(function(v){
    if(v.svc==null) return;
    var sv=svcOf(v.svc);
    if(!sv||sv.stops.length<2){ v.svc=null; return; }
    if(v.si>=sv.stops.length) v.si=0;
    var c0=CITY[sv.stops[v.si]]; v.x=c0.x; v.y=c0.y; v.at=sv.stops[v.si];
  });
  invalidate();
  return true;
}
function resetGame(){
  if(!confirm("Wipe your company and start again?")) return;
  resetting=true;
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  location.reload();
}

/* ============================================================ BOOT */
var loaded=loadGame();
if(!loaded) S=fresh();
buildMap(); fitAll(); refreshCities(); drawSvcs();
if(!loaded){
  buyTruck(1); buyTruck(1); S.cash=260000; S.spent=0;
}else{
  toast("Welcome back — day "+(Math.floor(S.t/24)+1)+", "+S.svcs.length+" service"+
        (S.svcs.length===1?"":"s")+", "+S.veh.length+" trucks.");
}
// The guide has to trigger off "has this player actually seen it", not off
// "does a save exist" -- an autosave fires every 5s and on every tab-hide, so
// someone who closed the tab mid-guide on their very first visit would get a
// save file before ever clicking through, and then never see it again.
var seenGuide=false; try{ seenGuide=localStorage.getItem("lh-seen-guide")==="1"; }catch(e){}
if(!seenGuide) setTimeout(function(){ showGuide(0); }, 400);
else if(!loaded) toast("Freight is waiting and <b>nothing moves it yet</b>. Open <b>Services</b> and build a loop.");
for(var i=0;i<4;i++) spawnLoad();
setTab(loaded?"loads":"loads");
renderNextStep();
setInterval(saveGame, 5000);
document.addEventListener("visibilitychange",function(){ if(document.hidden) saveGame(); });
window.addEventListener("beforeunload", saveGame);
window.addEventListener("resize",function(){ CITIES.forEach(function(c){c._w=null;}); applyCam(); });
// dev hook: lets an automated harness inspect and drive the sim
(function(){ var r=document.createElement("button"); r.className="hbtn"; r.textContent="⟲";
  r.title="Reset company"; r.onclick=resetGame;
  document.querySelector("header").appendChild(r); })();
window.__lh={ state:function(){return S;}, save:saveGame, load:loadGame, reset:function(){
    resetting=true; try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }, cities:CITIES, city:CITY, svcOf:svcOf,
  cam:function(){return cam;}, viewK:viewK, headway:headway, cycle:svcCycle,
  plan:function(a,b){return routePlan(a,b);},
  addSvc:function(stops){ var s=newSvc(); s.stops=stops.slice(); invalidate(); drawSvcs(); refreshCities(); return s.id; },
  put:function(svcId,n){ var s=svcOf(svcId),k=0;
    S.veh.forEach(function(v){ if(!v.svc&&k<n){ assign(v,s); k++; } }); drawSvcs(); render(); return k; },
  buy:function(t,n){ var k=0; for(var i=0;i<n;i++) if(buyTruck(t)) k++; return k; },
  fast:function(x){ S.speed=x; },
  // drive the sim directly, for balance measurement without waiting real time
  sim:function(hours,dt){ dt=dt||0.05; var n=Math.round(hours/dt), every=0.85;
    var acc=0;
    for(var i=0;i<n;i++){ step(dt); acc+=dt;
      var e=0.85/((0.25+0.75*repScore())*(1+0.12*up("sales"))*(1+0.20*projPerk("volume")));
      while(acc>=e){ acc-=e; spawnLoad(); } } },
  verdict:svcVerdict, vehRate:vehRate, truckCan:truckCan, cap:tCap, supply:svcSupply,
  unlock:unlockCity, unlockCost:unlockCost, locked:cityLocked, unload:unloadCargo };
requestAnimationFrame(frame);
})();
</script>
