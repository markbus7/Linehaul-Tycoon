<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Linehaul Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------------------
     Visual system. One cool, quiet ink palette for everything structural, and
     colour reserved for meaning: amber = money / your company, green = working,
     red = losing, blue = info. The map is a calm night-chart so the network you
     build on it is the brightest thing on screen.
     ------------------------------------------------------------------------- */
  :root{
    --bg:#080b10;--panel:#0d1117;--panel2:#131922;--panel3:#18202a;--line:#222c38;--line2:#2c3846;
    --hair:rgba(255,255,255,.06);--hair2:rgba(255,255,255,.1);
    --ink:#e9eef4;--ink2:#c3ccd7;--dim:#8794a4;--dim2:#5a6676;
    --amber:#f7b441;--amber2:#ffd27a;--green:#34d399;--red:#f87171;--blue:#60a5fa;--violet:#c4a1ff;
    --sea:#9cb3c1;--land:#1b242d;--landln:#2b3743;
    --font-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-display:"Space Grotesk","Inter",ui-sans-serif,system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --r-sm:2px;--r:3px;--r-lg:4px;
    --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 24px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-ui);
    font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased;overflow:hidden}
  body{display:flex;flex-direction:column}
  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

  /* ---------------------------------------------------------------- top HUD */
  header{display:flex;align-items:center;gap:0;padding:10px 14px;flex:0 0 auto;flex-wrap:wrap;
    background:linear-gradient(180deg,#0f141b,#0b0f15);border-bottom:1px solid var(--hair);
    position:relative;z-index:5}
  header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent 2%,rgba(247,180,65,.45) 20%,rgba(96,165,250,.25) 60%,transparent 98%)}
  .brand{font-family:var(--font-display);font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;
    margin-right:18px}
  .brand .bmark{width:30px;height:30px;border-radius:2px;display:grid;place-items:center;flex:0 0 auto;background:var(--amber)}
  .brand .bmark svg{width:20px;height:20px;display:block}
  .brand .bname{display:flex;flex-direction:column;line-height:1}
  .brand .bword{letter-spacing:.16em;color:var(--ink)}
  .brand .bver{font-family:var(--font-mono);font-weight:500;font-size:9.5px;letter-spacing:.08em;color:var(--dim2);
    margin-top:4px;text-transform:uppercase}
  .stat{display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:2px 18px;min-height:38px;
    border-left:1px solid var(--hair2)}
  .stat .k{font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
  .stat .v{font-family:var(--font-mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;
    margin-top:3px;letter-spacing:-.01em}
  .v.money{color:var(--amber2)} .v.ok{color:var(--green)} .v.bad{color:var(--red)} .v.warn2{color:var(--amber)}
  .netstat{min-width:92px}
  .sp{flex:1}
  .lvlstat{min-width:104px}
  .xpbar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:5px;overflow:hidden}
  .xpbar i{display:block;height:100%;width:0;background:var(--amber)}
  .achbar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:6px;overflow:hidden}
  .achbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#93c5fd)}
  .achp{font-size:10.5px;color:var(--dim);margin-top:3px}
  .ach{display:flex;gap:11px;align-items:flex-start;padding:11px;border-radius:3px;margin-bottom:7px;
    background:var(--panel2);border:1px solid var(--hair);opacity:.55}
  .ach.got{opacity:1;border-color:rgba(52,211,153,.25);background:linear-gradient(180deg,rgba(52,211,153,.07),rgba(52,211,153,.02)),var(--panel2)}
  .ach .ai{font-size:19px;width:36px;height:36px;flex:0 0 auto;border-radius:3px;display:grid;place-items:center;
    background:var(--panel3);border:1px solid var(--hair)}
  .ach.got .ai{background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.3)}
  .ach .an{font-weight:600;font-size:13px}
  .ach .ad{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.45}
  .ach .ar{font-family:var(--font-mono);font-size:11px;color:var(--amber);flex:0 0 auto}
  .ach.got .ar{color:var(--green)}
  .lock{font-size:10px;color:var(--dim2);font-family:var(--font-mono)}
  .gbody p{font-size:14px;line-height:1.7;color:var(--ink2);margin-bottom:11px}
  .gbody em{color:var(--amber2);font-style:normal;font-weight:600}
  .gnav{display:flex;align-items:center;gap:12px;margin-top:6px;padding-top:12px;border-top:1px solid var(--hair)}
  .gdots{flex:1;display:flex;gap:6px;justify-content:center}
  .gd{width:6px;height:6px;border-radius:3px;background:var(--line2);display:block;transition:width .2s}
  .gd.on{width:18px;background:var(--amber)}
  .hbtn{font-family:var(--font-display);min-width:38px;height:38px;padding:0 13px;margin-left:6px;border:1px solid var(--hair2);
    border-radius:3px;font-size:14px;font-weight:600;display:inline-grid;place-items:center;
    background:transparent;color:var(--ink2);transition:border-color .15s,color .15s,background .15s,transform .1s}
  .hbtn:hover{border-color:rgba(247,180,65,.6);color:var(--amber2);background:rgba(247,180,65,.06)}
  .hbtn:active{transform:translateY(1px)}
  .hbtn.on{border-color:var(--amber);color:var(--amber);background:rgba(247,180,65,.1)}

  @media(max-width:700px){
    header{gap:6px;padding:8px 10px}
    .brand{margin-right:2px} .brand .bname{display:none}
    .stat{padding:4px 8px;min-height:36px;border-radius:3px}
    .stat .k{font-size:8.5px} .stat .v{font-size:13.5px;margin-top:2px}
    .netstat,.lvlstat{min-width:0}
    .hbtn{min-width:34px;height:34px;padding:0 9px}
  }
  main{flex:1;display:flex;min-height:0}
  @media(max-width:900px){main{flex-direction:column}}
  .mapwrap{flex:1;position:relative;background:var(--sea);min-height:0;overflow:hidden;touch-action:none}
  .mapwrap::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
  svg{width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;touch-action:none}

  /* --------------------------------------------------------------- sidebar */
  aside{width:400px;flex:0 0 auto;border-left:1px solid var(--hair);background:var(--panel);
    display:flex;flex-direction:column;min-height:0;box-shadow:-12px 0 32px rgba(0,0,0,.35);position:relative;z-index:3}
  @media(max-width:900px){aside{width:auto;border-left:none;border-top:1px solid var(--hair);height:47%}}
  .tabs{display:flex;flex:0 0 auto;gap:0;padding:4px 6px 0;border-bottom:1px solid var(--hair);background:var(--panel)}
  .tabs button{flex:1;padding:12px 2px 12px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    position:relative;transition:color .15s;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
  .tabs button:hover{color:var(--ink2)}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    border-radius:2px 2px 0 0;background:var(--amber)}
  .tabs .bdg{display:inline-block;padding:0;
    background:none;color:var(--dim2);font-size:10px;font-weight:600;line-height:17px;font-family:var(--font-mono)}
  .tabs button.on .bdg{color:var(--amber2)}
  .tabs .bdg.warn{color:#fca5a5}
  .nextstep{flex:0 0 auto;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--hair);
    background:rgba(52,211,153,.05);border-left:3px solid var(--green)}
  .nextstep .nsk{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6ee7b7;font-weight:700}
  .nextstep .nst{font-family:var(--font-display);font-size:15.5px;font-weight:700;color:var(--ink);margin-top:3px}
  .nextstep .nsw{font-size:12px;color:#a7b8b0;margin-top:4px;line-height:1.5}
  .nextstep .nsp{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
  .nextstep .nsp i{display:block;height:100%;background:var(--green)}
  .nextstep.done{background:rgba(247,180,65,.05);border-left-color:var(--amber)}
  .nextstep.done .nsk{color:var(--amber2)}
  .body{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch;background:var(--panel)}
  .body::-webkit-scrollbar{width:10px}
  .body::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;border:3px solid transparent;background-clip:padding-box}
  .body::-webkit-scrollbar-thumb:hover{background:var(--line2);background-clip:padding-box}

  .card{background:transparent;border:none;border-bottom:1px solid var(--hair);border-radius:0;
    padding:12px 20px 12px 26px;margin:0 -10px;position:relative;overflow:hidden;transition:background .15s}
  .card:hover{background:rgba(255,255,255,.02)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
  .card.warn::before{background:var(--amber)}
  .card.bad::before{background:var(--red);opacity:.85}
  .card.good::before{background:var(--green)}
  .row{display:flex;align-items:center;gap:11px}
  .grow{flex:1;min-width:0}
  .ttl{font-family:var(--font-display);font-weight:600;font-size:14.5px;letter-spacing:-.005em}
  .sub{font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.5}
  .lbl{font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    color:var(--dim);margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
  .lbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair2),transparent)}
  .lbl:first-child{margin-top:4px}
  .btn{font-family:var(--font-display);background:var(--amber);color:#1a1205;
    font-weight:700;font-size:13.5px;padding:8px 15px;border-radius:3px;white-space:nowrap;
    box-shadow:none;transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.07)} .btn:active{transform:translateY(1px)}
  .btn:disabled{background:var(--panel3);color:var(--dim2);box-shadow:none;cursor:not-allowed}
  .btn.ghost{background:rgba(255,255,255,.04);border:1px solid var(--hair2);color:var(--ink);font-weight:600;box-shadow:none}
  .btn.ghost:hover{background:rgba(255,255,255,.07)}
  .btn.danger{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:#fca5a5;box-shadow:none}
  .btn.sm{padding:6px 11px;font-size:12.5px}
  .pill{display:inline-block;font-size:10px;font-weight:500;padding:2px 7px;border-radius:3px;
    background:rgba(255,255,255,.05);color:var(--dim);font-family:var(--font-mono);border:1px solid var(--hair)}
  .pill.g{background:rgba(52,211,153,.1);color:#6ee7b7;border-color:rgba(52,211,153,.22)}
  .pill.r{background:rgba(248,113,113,.1);color:#fca5a5;border-color:rgba(248,113,113,.22)}
  .pill.a{background:rgba(247,180,65,.1);color:var(--amber2);border-color:rgba(247,180,65,.22)}
  .pill.b{background:rgba(96,165,250,.1);color:#93c5fd;border-color:rgba(96,165,250,.22)}
  /* rush freight: pays far over the odds on a much tighter clock */
  .pill.rushp{background:rgba(247,180,65,.2);color:#ffd27a;border-color:rgba(247,180,65,.45);font-weight:700}
  .card.rush{background:linear-gradient(90deg,rgba(247,180,65,.07),transparent 70%)}
  .card.rush::before{background:linear-gradient(180deg,#ffd27a,#f59e0b)}
  .card.rush .money .amt{color:#ffd27a}
  .svcverdict{margin-top:9px;line-height:1.7}
  .vrate{font-family:var(--font-mono);font-size:11px;font-weight:600;margin-left:6px}
  .vrate.good{color:var(--green)} .vrate.warn{color:var(--amber)} .vrate.bad{color:var(--red)}
  .empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 18px;line-height:1.75;
    background:var(--panel2);border:1px dashed var(--line2);border-radius:3px}
  .empty b{color:var(--ink)}

  /* ---------------------------------------------------------- map furniture */
  .land{stroke:#8f8677;stroke-width:.8;stroke-opacity:1;vector-effect:non-scaling-stroke;
        stroke-linejoin:round;transition:fill .6s ease}
  .geolbl{fill:#3d3428;fill-opacity:.38;font-family:var(--font-ui);font-weight:600;letter-spacing:.32em;
    text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .sealbl{fill:#4f7389;fill-opacity:.75;font-family:Georgia,"Times New Roman",serif;font-style:italic;
    letter-spacing:.12em;text-anchor:middle;dominant-baseline:central;pointer-events:none}
  .land.mine{fill:url(#landMine);stroke:#6fa27e}
  .grat{stroke:#6f8fa3;stroke-width:.5;opacity:.28;vector-effect:non-scaling-stroke;fill:none}
  .svccase{fill:none;stroke:#efece5;stroke-width:9;opacity:.9;stroke-linejoin:round;
           stroke-linecap:round;vector-effect:non-scaling-stroke}
  .svcline{fill:none;stroke-width:5;opacity:1;stroke-linejoin:round;stroke-linecap:round;
           vector-effect:non-scaling-stroke;cursor:pointer}
  .svcflow{fill:none;stroke-width:2;opacity:.85;stroke-linecap:round;vector-effect:non-scaling-stroke;
           stroke-dasharray:1 13;animation:flow 1.4s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-14}}
  .cshadow{display:none}
  .cpad{fill:#fff;stroke:#2b2e33;stroke-width:1.6;vector-effect:non-scaling-stroke;
        cursor:pointer;transition:stroke .3s}
  .cpad.served{fill:#fff;stroke:#16181b;stroke-width:2.6}
  .cpad.home{fill:#f59e0b;stroke:#16181b;stroke-width:2.6}
  .cpad.sel{stroke:#2563eb;stroke-width:3}
  .cpad.addable{stroke-dasharray:2.5 2;cursor:pointer}
  .cpad.inedit{cursor:pointer}
  /* locked cities are just quiet waypoints on the chart -- a small hollow dot,
     no glyph -- so the handful of places you actually run stand out */
  .cpad.locked{fill:#8e8778;stroke:none;opacity:1}
  .cpad.locked.sel{stroke:#2563eb;stroke-width:1.6;opacity:1}
  .cpin.locked .cshadow,.cpin.locked .cglyph{display:none}
  .clabel.locked{opacity:1;fill:#6f695d;font-weight:500;font-size:9px}
  .lplate.locked{display:none}
  .editpreview{fill:none;stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round;opacity:.9;
    vector-effect:non-scaling-stroke;pointer-events:none}
  /* route colour tells you how a service is doing at a glance -- green pays,
     amber is treading water, red is losing money and dashed to make sure it
     doesn't rely on colour alone. Tap the line for the full breakdown. */
  .svcline.perf-good{stroke:#14a06b}
  .svcline.perf-warn{stroke:#f08c00}
  .svcline.perf-bad{stroke:#e03e45;stroke-dasharray:6 5;opacity:.85}
  .cglyph{display:none}
  .chalo{fill:rgba(52,211,153,.12);stroke:var(--green);stroke-width:1.2;opacity:0;vector-effect:non-scaling-stroke}
  .chalo{display:none}
  .chalo.on{opacity:0;animation:halo 2.2s ease-in-out infinite;will-change:opacity}
  @keyframes halo{0%{opacity:.6}70%{opacity:.1}100%{opacity:.6}}
  .cbadge{fill:#16181b;stroke:none}
  .cbadge-t{fill:#fff;font-family:var(--font-mono);font-size:6px;font-weight:700;text-anchor:middle;
            dominant-baseline:central;pointer-events:none}
  .lplate{display:none}
  .cring{fill:none;stroke:#4a5a6a;stroke-width:1;opacity:.5;vector-effect:non-scaling-stroke}
  .cinv{fill:none;stroke:var(--amber);stroke-width:1.2;opacity:.75;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
  .clabel{fill:#4a4740;font-family:var(--font-ui);font-size:9.5px;font-weight:500;letter-spacing:.01em;
    pointer-events:none;paint-order:stroke;stroke:#d6d1c6;stroke-width:3px;stroke-linejoin:round}
  .clabel.served{fill:#16181b;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:9px}
  .clabel.hide{display:none}
  .veh{pointer-events:none}
  .load-pip{fill:var(--amber);pointer-events:none}

  /* ------------------------------------------------------------ overlays */
  .modal{position:fixed;inset:0;background:rgba(3,5,9,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .modal.show{display:flex}
  .mbox{background:linear-gradient(180deg,#121821,#0e131a);border:1px solid var(--hair2);border-radius:3px;
    width:100%;max-width:480px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.02) inset;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .mhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--hair)}
  .mhead h2{font-family:var(--font-display);font-size:17px;font-weight:700;flex:1}
  .mbody{padding:16px;overflow-y:auto}
  .mbody p{font-size:13.5px;color:var(--ink2);line-height:1.65;margin-bottom:9px}
  .mbody h3{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--amber);margin:18px 0 7px}
  .mbody h3:first-child{margin-top:0}
  .mbody em{color:var(--ink);font-style:normal;font-weight:600}

  .kv{display:flex;gap:10px;padding:9px 11px;background:var(--panel2);border:1px solid var(--hair);
    border-radius:3px;margin-bottom:6px}
  .kv .k{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);flex:0 0 88px;padding-top:2px}
  .kv.mini{flex-direction:column;gap:3px;padding:8px 10px}
  .kv.mini .k{flex:none;padding-top:0}
  .kv.mini .v{font-family:var(--font-mono);font-size:13px}
  .kv .v{flex:1;font-size:12.5px;line-height:1.55}
  .goods{display:flex;flex-wrap:wrap;gap:4px}
  .good{font-size:11px;padding:2px 8px;border-radius:3px;background:rgba(255,255,255,.05);color:var(--ink2);
    white-space:nowrap;border:1px solid var(--hair)}
  .good.out{background:rgba(247,180,65,.08);color:#f6cf8a;border-color:rgba(247,180,65,.18)}
  .good.in{background:rgba(96,165,250,.08);color:#a5c8f5;border-color:rgba(96,165,250,.18)}

  .stops{display:flex;flex-direction:column;gap:5px}
  .stop{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--hair);
    border-radius:3px;padding:7px 9px;transition:transform .15s}
  .stop.dragging{transition:none;opacity:.95;box-shadow:0 10px 24px rgba(0,0,0,.5);z-index:5;position:relative}
  .draghandle{cursor:grab;color:var(--dim2);font-size:15px;padding:2px 5px;touch-action:none;flex:0 0 auto;
    user-select:none}
  .stop.dragging .draghandle{cursor:grabbing}
  .stopn{width:20px;height:20px;border-radius:2px;background:rgba(247,180,65,.12);display:grid;place-items:center;
    font-size:10px;font-weight:600;font-family:var(--font-mono);color:var(--amber2);flex:0 0 auto}
  .stopbtn{width:26px;height:26px;border-radius:3px;background:rgba(255,255,255,.03);border:1px solid var(--hair);
    font-size:11px;display:grid;place-items:center}
  .stopbtn:disabled{opacity:.28}
  .vopt{margin-top:8px;border-top:1px solid var(--hair);padding-top:8px}
  .optrow{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:4px}
  .optk{font-size:10px;font-weight:600;color:var(--dim2);letter-spacing:.06em;text-transform:uppercase;
    flex:0 0 68px}
  .optb{background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:3px;color:var(--dim);
    font-size:11px;padding:3px 8px;min-height:24px}
  .optb.on{background:rgba(96,165,250,.12);border-color:rgba(96,165,250,.6);color:var(--ink);font-weight:600}
  .gtile{width:34px;height:34px;flex:0 0 auto;border-radius:2px;display:grid;place-items:center;
    font-size:18px;background:var(--panel3)}
  .ld .wt{font-family:var(--font-mono);font-size:11px;color:var(--dim);font-weight:500;margin-left:2px}
  .route2{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
  .route2 b{color:var(--ink2);font-weight:600}
  .route2 .ar{color:var(--dim2);margin:0 5px}
  .money{text-align:right;flex:0 0 auto}
  .money .amt{font-family:var(--font-mono);font-weight:600;font-size:14px;color:#6ee7b7}
  .money .pill{margin-top:4px}
  /* the "how this load will travel" note -- a quiet footnote under the card,
     not a second red alert box, so a list of unroutable loads stays scannable */
  .plan{margin-top:8px;padding:6px 10px;background:rgba(255,255,255,.025);border-radius:0;
    font-size:11.5px;line-height:1.55;color:var(--dim);border:1px solid var(--hair)}
  .plan b{color:var(--ink2);font-weight:600}
  .plan.ok{background:rgba(52,211,153,.05);border-color:rgba(52,211,153,.14)}
  .plan.tight{background:rgba(247,180,65,.05);border-color:rgba(247,180,65,.16)}
  .plan.late{background:rgba(248,113,113,.05);border-color:rgba(248,113,113,.16)}
  .plan.none{background:none;border:none;padding:0 2px;margin-top:7px;color:var(--dim)}
  .plan.none b{color:#fca5a5}
  .plan .leg{display:block}
  .plan .xfer{color:var(--amber)}
  .toasts{position:absolute;left:14px;bottom:14px;right:64px;max-width:520px;display:flex;flex-direction:column;gap:6px;
    pointer-events:none;z-index:8}
  .toast{background:rgba(13,17,23,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--hair2);border-radius:3px;padding:10px 14px 10px 16px;font-size:12.5px;line-height:1.5;
    color:var(--ink2);box-shadow:0 12px 30px -12px rgba(0,0,0,.7);position:relative;overflow:hidden;animation:tin .25s ease}
  .toast::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber)}
  .toast b{color:var(--ink)}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mapctl{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;z-index:7;
    background:rgba(13,17,23,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border:1px solid var(--hair2);border-radius:3px;overflow:hidden;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}

  .mapctl button+button{border-top:1px solid var(--hair)}
  .mapctl button:hover{background:rgba(255,255,255,.06);color:var(--amber2)}

function haversine(a,b){
  var R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180;
  var la1=a.lat*Math.PI/180,la2=b.lat*Math.PI/180;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(la1)*Math.cos(la2)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
var DIST={};
CITIES.forEach(function(a){ DIST[a.id]={}; CITIES.forEach(function(b){ DIST[a.id][b.id]=Math.round(haversine(a,b)); }); });
function km(a,b){ return DIST[a][b]; }
function eur(n){ n=Math.round(n);
  if(Math.abs(n)>=1e6) return "€"+(n/1e6).toFixed(2)+"M";
  if(Math.abs(n)>=1e4) return "€"+Math.round(n/1e3)+"k";
  if(Math.abs(n)>=1000) return "€"+(n/1e3).toFixed(1)+"k";
  return "€"+n; }
function hrs(h){ if(h<1) return Math.round(h*60)+"m"; if(h<48) return h.toFixed(1).replace(/\.0$/,"")+"h";

// a load with a `req` can only ride a truck carrying that equipment
// What a vehicle is physically able to carry.
//   tanker / bulk carrier  -- liquids only. A tank cannot hold boxes.
//   car transporter        -- finished cars only, for the same reason.
//   reefer / reefer plane  -- a refrigerated trailer is still a box, so it
//                             carries dry freight as well as food, exactly as
//                             real reefers do on their return legs.
//   everything else        -- general freight only.
// (This used to read `!TRUCKS[type].spec || true`, which is always true, so
//  every specialised vehicle could also haul general cargo -- making tankers
//  and transporters strictly better than plain trucks rather than a trade-off.)
function truckCan(type,good){
  var r=GOODS[good]&&GOODS[good].req, sp=TRUCKS[type].spec;
  if(!r) return !sp || sp==="reefer";
  return sp===r;
}

// wait available even on a very frequent line; HOLD_MARGIN is the cushion left

var HOLD_MIN_H=1, HOLD_MARGIN=0.5;
var MIN_LOAD_T=3;  // spawnLoad never creates a load smaller than this
// Default is a full load: an empty or half-empty truck still burns the same
// wages and nearly the same fuel, so waiting to fill up is the sane opening
// position. `null` means "never set", which is what an older save carries.
function vFill(v){ return v.minFill==null ? 1 : v.minFill; }
function vPick(v){ return v.pickG||"all"; }
// goods this vehicle is allowed to load right now, given its own equipment and
// the freight-type filter the player chose
function vehTakes(v,good){
  if(!truckCan(v.type,good)) return false;
  var p=vPick(v);
  return p==="all" || p===good;
}
// Ships need a port at every stop, planes an air hub at every stop, and a
// road vehicle needs every stop reachable overland -- Europe/Africa/Asia are
// one connected landmass, the Americas another, and Oceania is islands-only.
function vehCanServe(type,s){
  var T=TRUCKS[type];
  if(T.mode==="sea") return s.stops.every(function(id){return CITY[id].port;});
  if(T.mode==="air") return s.stops.every(function(id){return CITY[id].air;});
  if(!s.stops.length) return true;
  var lm=cityLandmass(CITY[s.stops[0]]);
  return s.stops.every(function(id){return cityLandmass(CITY[id])===lm;});
}
function vehCantServeWhy(type,s){
  var T=TRUCKS[type];
  if(T.mode==="sea") return "needs a port at every stop";
  if(T.mode==="air") return "needs an air hub at every stop";
  return "can't cross an ocean — this loop spans more than one landmass";
}
function specsOn(s){
  var out={gen:false};
  svcVehs(s).forEach(function(v){ var sp=TRUCKS[v.type].spec; if(sp) out[sp]=true; else out.gen=true; });
  return out;
}
// Which goods this loop can actually earn from: a stop that SHIPS something
// paired with a different stop that TAKES it. A loop with no such pair earns
// nothing at all no matter how many trucks are on it -- the single most
// confusing failure in the game, because nothing on screen used to say so.
function svcTradePairs(s){
  var out=[], seen={};
  if(!s.stops||s.stops.length<2) return out;
  s.stops.forEach(function(fromId){
    (CITY[fromId].out||[]).forEach(function(g){
      s.stops.forEach(function(toId){
        if(toId===fromId) return;
        if((CITY[toId].in||[]).indexOf(g)<0) return;
        var k=g+fromId+toId; if(seen[k]) return; seen[k]=1;
        out.push({g:g, from:fromId, to:toId});
      });
    });
  });
  return out;
}
function svcCanCarry(s,good){
  var r=GOODS[good]&&GOODS[good].req;
  var sp=specsOn(s);
  return r? !!sp[r] : sp.gen || Object.keys(sp).some(function(k){return k!=="gen"&&sp[k];});
}

/* ============================================================ STATE */
var S = null, nextId = 1;
var WAGE_PER_H = 3.2;   // per truck, per game hour
// Cities you start with: your yard plus the tight Rhine cluster around it, so
// there is an immediately playable network before any unlocking is needed.
var STARTER_CITIES=["duiven","rotterdam","antwerp","duisburg","koln"];
function fresh(){
  var unlocked={}; STARTER_CITIES.forEach(function(id){ unlocked[id]=1; });
  return {
    cash: 260000, t: 0, xp:0, level:1, upg:{}, ach:{},   // t = game hours since start
    svcs: [], veh: [], loads: [],
    delivered: 0, late: 0, earned: 0, spent: 0,
    hist: {},                        // per-city history -> the mental story
    netHist: [], histStep: 2, lastHistT: 0,   // company net-worth over time -> the "am I winning" chart
    flow: 0, bestFlow: 0,                     // delivery-rate meter -> pay bonus
    seen: {}, speed: 1, unlocked: unlocked,
    netEma: null, svcEma: {}, svcEarnEma: {}, svcCostEma: {}, svcActiveH: {},  // live profit/loss, company-wide and per service
    vehEma: {}, vehEarnEma: {}, vehCostEma: {}, vehActiveH: {}                 // same, but per truck
  };
}
// exponential moving average toward `instant`, with a game-hour time constant --
// this is what turns noisy per-tick cash flow into a readable trend
// Earnings arrive as lump sums when a truck completes a delivery -- roughly
// every headway, so every 5-10 game hours. Smoothing over only 3 hours meant
// the readout spiked on each delivery and sagged to negative in between, so a
// perfectly healthy line flickered between "Profitable" and "Losing money".
// A full game day spans several deliveries and gives a stable, honest trend.
var EMA_TAU=24;
// FLOW -- a delivery meter that every arrival feeds and that leaks away
// continuously. Keep freight landing and the bonus climbs; let the network
// stall and it drains. Measured across five network shapes, this game runs at
// 30-55% on-time, so an *unbroken run* of on-time deliveries was the wrong
// shape entirely -- the best run any of them managed was 7, which would have
// made a run-based bonus permanently stuck near zero. Flow instead rewards
// throughput, which is the thing the player actually builds, while a late
// arrival still feeds it less than an on-time one.
// TAU is deliberately longer than a headway: deliveries land in bursts (a truck
// arrives with three loads at once, then nothing for hours), and at 18h the
// bonus swung between +4% and +26% depending on which instant you looked. Thirty
// hours smooths the bursts into a number that tracks the network, not the tick.
var FLOW_TAU=30, FLOW_STEP=0.04, FLOW_CAP=0.50, FLOW_LATE=0.35;
var FLOW_MARKS=[0.15,0.25,0.40,0.50];
function flowMult(){ return 1 + Math.min(FLOW_CAP, FLOW_STEP*(S.flow||0)); }
function flowPct(){ return Math.round(100*(flowMult()-1)); }
// Set while the sim is being fast-forwarded (offline catch-up, or the test
// hook). Everything that pops a toast or animates a label on the map checks
// this, so hours of simulated events don't all try to render at once.
var simQuiet=false;
// Rush freight: about one offer in eleven pays far over the odds for a window
// roughly half as long. Worth chasing on a tight corridor, a trap on a sprawling
// one -- and since it is the same shipper either way, failing one only ever
// bills the ordinary cancellation fee (see pay0 below), never the inflated one.
var RUSH_CHANCE=0.09, RUSH_PAY=2.6;
// Hysteresis so the verdict word does not flap around a threshold: it takes a
// clearly positive rate to earn "Profitable" and a clearly negative one to be
// called "Losing money", with a wide neutral band in between that a service
// falls back into before it can flip to the opposite verdict.
function classifyRate(rate, last){
  if(last==="good") return rate<-8 ? (rate<-25?"bad":"warn") : "good";
  if(last==="bad")  return rate>8  ? (rate>25?"good":"warn") : "bad";
  if(rate>25) return "good";
  if(rate<-25) return "bad";
  return "warn";
}
function emaStep(prev, instant, dt, tau){
  if(prev==null) return instant;
  var k = 1-Math.exp(-dt/tau);
  return prev + (instant-prev)*k;
}
// Turns the net-worth samples into plotting-ready points, scaled into a
// fixed 0..100 x 0..34 box regardless of how much history there is or how
// wide the swings are -- the caller just drops the points into an <svg
// viewBox="0 0 100 34">. Always ends on the live cash figure, so the line
// reaches "right now" even between samples.
function netHistChart(){
  var hst=(S.netHist||[]).slice();
  hst.push({t:S.t,cash:S.cash});
  if(hst.length<2) return null;
  var W=100,H=34,PAD=2;
  var minC=hst[0].cash,maxC=hst[0].cash;
  hst.forEach(function(p){ if(p.cash<minC)minC=p.cash; if(p.cash>maxC)maxC=p.cash; });
  if(maxC===minC){ maxC+=1; minC-=1; }
  var t0=hst[0].t, t1=hst[hst.length-1].t;
  var span=Math.max(1e-6,t1-t0);
  var pts=hst.map(function(p){
    var x=PAD+(W-2*PAD)*((p.t-t0)/span);
    var y=PAD+(H-2*PAD)*(1-(p.cash-minC)/(maxC-minC));
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var line=pts.join(" ");
  var area=pts[0].split(",")[0]+","+(H-PAD)+" "+line+" "+pts[pts.length-1].split(",")[0]+","+(H-PAD);
  return {W:W,H:H,line:line,area:area,up:hst[hst.length-1].cash>=hst[0].cash,t0:t0};
}
// How cash has moved over roughly the last week of play -- the direct answer
// to "am I doing better or worse than before". Falls back to the oldest
// sample on hand if the game is younger than that.
function netHistDelta(){
  var hst=S.netHist||[];
  if(!hst.length) return null;
  var target=S.t-168, ref=hst[0];
  for(var i=0;i<hst.length;i++){ if(hst[i].t<=target) ref=hst[i]; else break; }
  var days=(S.t-ref.t)/24;
  if(days<0.15) return null;   // too little elapsed time to mean anything
  return {change:S.cash-ref.cash, days:days};
}
function rep(v){ if(!S.recent) S.recent=[]; S.recent.push(v); if(S.recent.length>40) S.recent.shift(); }
function repScore(){ if(!S.recent||!S.recent.length) return 1;
  var t=0; S.recent.forEach(function(v){t+=v;}); return t/S.recent.length; }
function hist(id){ if(!S.hist[id]) S.hist[id]={out:0,in:0,paid:0,late:0,first:null}; return S.hist[id]; }

/* ============================================================ LOADS
   Generated from the real produce/consume chains above, weighted toward
   nearby pairs so regional corridors dominate early and long hauls appear
   as the network grows.                                                   */
var PRODUCERS={}, CONSUMERS={};
Object.keys(GOODS).forEach(function(g){
  PRODUCERS[g]=CITIES.filter(function(c){return (c.out||[]).indexOf(g)>=0;});
  CONSUMERS[g]=CITIES.filter(function(c){return (c.in||[]).indexOf(g)>=0;});
});
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
// How much freight a single city will hold waiting for collection. Bigger
// places generate more trade, and a freight office there wins more still.
function cityCap(c){ return 4 + Math.round(c.size*0.8) + 2*officeLvl(c.id); }
function cityWaiting(id){
  var n=0; for(var i=0;i<S.loads.length;i++){ var l=S.loads[i];
    if(!l.on && l.at===id) n++; }
  return n;
}
function spawnLoad(){
  // Freight used to be capped globally at 6+3*trucks -- 12 loads for the entire
  // world with a starting fleet, which the game sat against ~84% of the time.
  // Anything stuck at one city therefore starved every other city of new work.
  // The ceiling is per city now, so clearing a backlog genuinely makes room for
  // that city to offer more, with a looser global bound just to keep the load
  // list and the router bounded.
  var capLoads=Math.min(90, 14+5*S.veh.length);
  if(S.loads.length>=capLoads) return;
  // Only cities you have unlocked can offer or receive freight. A shipper in a
  // city where you have no presence at all would never call you -- and since an
  // expired load used to bill you, offering work between two locked cities was
  // charging the player for jobs they had no possible way to accept.
  var opnP={}, opnC={};
  Object.keys(GOODS).forEach(function(g){
    opnP[g]=PRODUCERS[g].filter(function(c){return !cityLocked(c.id);});
    opnC[g]=CONSUMERS[g].filter(function(c){return !cityLocked(c.id);});
  });
  var gs=Object.keys(GOODS).filter(function(g){return opnP[g].length&&opnC[g].length;});
  if(!gs.length) return;
  var g=pick(gs);
  // Business follows your network. Most freight offered touches a city you
  // actually serve, so building a service immediately brings work -- with a
  // slice from elsewhere so you can still see what you are missing.
  var served=servedCities(), servedIds=Object.keys(served);
  var from;
  // First try to offer work that runs between two cities you serve -- winning a
  // customer is the reward for having built a useful corridor.
  if(servedIds.length && Math.random()<0.68){
    var pairGoods=gs.filter(function(gg){
      return opnP[gg].some(function(c){return served[c.id];}) &&
             opnC[gg].some(function(c){return served[c.id];}); });
    if(pairGoods.length){
      g=pick(pairGoods);
      var ps=opnP[g].filter(function(c){return served[c.id];});
      // weight origins by freight office too
      var wsum=0,ws=ps.map(function(c){var w=1+0.5*officeLvl(c.id);wsum+=w;return w;});
      var r2=Math.random()*wsum; from=ps[0];
      for(var q=0;q<ps.length;q++){ r2-=ws[q]; if(r2<=0){from=ps[q];break;} }
    }
  }
  if(!from && servedIds.length && Math.random()<0.6){
    var onNet=opnP[g].filter(function(c){return served[c.id];});
    from = onNet.length ? pick(onNet) : pick(opnP[g]);
  } else if(!from && !servedIds.length){
    // before you have anything, keep the offers close to the yard
    var near=opnP[g].filter(function(c){return km("duiven",c.id)<520;});
    from = near.length ? pick(near) : pick(opnP[g]);
  } else if(!from) from=pick(opnP[g]);
  // A city can only have so much freight standing on its dock. Once it is at
  // its own ceiling it offers nothing more until a truck clears some -- which
  // is what makes emptying a backlog worth doing, rather than the whole world
  // sharing one small pool.
  if(cityWaiting(from.id) >= cityCap(from)) return;
  // prefer a nearby consumer: real freight is mostly regional
  var cands=opnC[g].filter(function(c){return c.id!==from.id;});
  if(!cands.length) return;
  var scored=cands.map(function(c){
    var w=(c.size+1)/Math.pow(Math.max(120,km(from.id,c.id))/500,1.35);
    if(served[c.id]) w*=6;                         // pairs you can actually serve
    else if(!servedIds.length && km("duiven",c.id)>520) w*=0.25;
    w*=1+0.5*officeLvl(c.id);                      // a freight office pulls trade in
    return {c:c,w:w};
  });
  var tot=0; scored.forEach(function(s){tot+=s.w;});
  var r=Math.random()*tot, to=scored[0].c;
  for(var i=0;i<scored.length;i++){ r-=scored[i].w; if(r<=0){ to=scored[i].c; break; } }
  var d=km(from.id,to.id);
  var G=GOODS[g];
  var wt=Math.max(3, Math.round((4+Math.random()*22) * (G.t==="bulk"?1.5:G.t==="heavy"?1.1:1)));
  var pay0=Math.round(d*wt*G.rate*0.115 + 160);
  // A window generous enough to be met by a decent network, tight enough that
  // one enormous loop cannot serve it.
  var drive=d/78;
  var rush=Math.random()<RUSH_CHANCE;
  var pay=rush?Math.round(pay0*RUSH_PAY):pay0;
  var due=rush ? S.t + drive*1.25 + 4 + Math.random()*4
               : S.t + drive*1.8  + 14 + Math.random()*16;
  S.loads.push({id:nextId++, g:g, from:from.id, to:to.id, w:wt, pay:pay, pay0:pay0, km:d,
                rush:rush?1:0, born:S.t, due:due, at:from.id, on:null, plan:null, step:0});
}

/* ============================================================ SERVICES
   A service is an ordered loop of stops with trucks assigned. Headway --
   how often a truck actually shows up -- is cycle time / trucks, and that
   single number is what makes a sprawling route useless.                  */
var SVC_COLORS=["#4fb4f5","#3ddb96","#c9a0ff","#ffb84d","#ff6e76","#4dd0d9","#ef9bd4","#b5e065"];
function newSvc(){
  var s={id:nextId++, n:"Service "+(S.svcs.length+1), stops:[],
         col:SVC_COLORS[S.svcs.length%SVC_COLORS.length]};
  S.svcs.push(s); return s;
}
function svcOf(id){ for(var i=0;i<S.svcs.length;i++) if(S.svcs[i].id===id) return S.svcs[i]; return null; }
function svcVehs(s){ return S.veh.filter(function(v){return v.svc===s.id;}); }
function legKm(s,i){ return km(s.stops[i], s.stops[(i+1)%s.stops.length]); }
function loopKm(s){ if(s.stops.length<2) return 0; var t=0; for(var i=0;i<s.stops.length;i++) t+=legKm(s,i); return t; }
// cycle time in hours for a given truck type, including dwell at every stop
function cycleH(s,type){
  if(s.stops.length<2) return 0;
  var T=TRUCKS[type==null?1:type], t=loopKm(s)/tSpeed(T.id);
  s.stops.forEach(function(id){ t+=dwellAt(id,type==null?1:type); });
  return t;
}
function svcCycle(s){
  var vs=svcVehs(s);
  if(!vs.length) return cycleH(s,1);
  var t=0; vs.forEach(function(v){ t+=cycleH(s,v.type); });
  return t/vs.length;
}
// plain-language read on a service: is it actually working, and specifically
// WHY not, when it isn't. `rate`/`earn`/`cost` are smoothed EUR/h whenever
// there is data to show, else null.
function svcVerdict(s){
  var vs=svcVehs(s);
  if(!s.stops||s.stops.length<2) return {cls:"bad",word:"No route",help:"Needs at least 2 stops.",rate:null,earn:null,cost:null};
  if(!vs.length) return {cls:"bad",word:"Idle",help:"No trucks assigned — nothing moves on this loop.",rate:null,earn:null,cost:null};
  var age=(S.svcActiveH&&S.svcActiveH[s.id])||0;
  var rate=S.svcEma?S.svcEma[s.id]:null;
  var earn=S.svcEarnEma?S.svcEarnEma[s.id]:null, cost=S.svcCostEma?S.svcCostEma[s.id]:null;
  // No verdict until at least one full round trip has had time to happen --
  // before that the line has paid wages and fuel but has not yet been paid for
  // anything, so any reading is guaranteed to look terrible and mean nothing.
  var warm=Math.max(8, svcCycle(s));
  if(age<warm||rate==null) return {cls:"warn",word:"Warming up",
    help:"Give it one full round trip ("+hrs(warm)+") before judging — it has paid wages and fuel but has not been paid for a delivery yet.",
    rate:null,earn:null,cost:null};
  if(!S.svcCls) S.svcCls={};
  var cls=classifyRate(rate, S.svcCls[s.id]);
  S.svcCls[s.id]=cls;
  if(cls==="good") return {cls:"good",word:"Profitable",help:"Earning "+eur(rate)+"/h more than it costs to run.",rate:rate,earn:earn,cost:cost};
  if(cls==="warn") return {cls:"warn",word:"Breaking even",
    help:"Earning "+eur(earn)+"/h against "+eur(cost)+"/h in costs — roughly covering itself. A little more freight on this loop would tip it into profit.",
    rate:rate,earn:earn,cost:cost};
  // losing money: work out which of the three real causes actually applies
  // here, instead of naming all of them and leaving the player to guess
  var wageOnly=vs.length*wageRate();
  var why;
  if(earn<8){
    why="This loop is carrying almost nothing — only "+eur(earn)+"/h in fees. These cities may not trade much "+
        "with each other. Check each city's Ships out / Takes in list, or extend the loop toward one that wants "+
        "what your stops produce.";
  }else if(vs.length>1){
    why=vs.length+" trucks are chasing "+eur(earn)+"/h of freight here — that is not enough to go round. "+
        "Remove a truck, or find this loop more freight, rather than adding more capacity.";
  }else if(cost-wageOnly>wageOnly && loopKm(s)>700){
    why="The loop itself is the cost: "+Math.round(loopKm(s))+"km round trip burns roughly "+
        eur(cost-wageOnly)+"/h in fuel alone. Shorten it, or hand the far leg to a second service "+
        "that meets this one partway, instead of running the whole distance yourself.";
  }else{
    why="Earning "+eur(earn)+"/h against "+eur(cost)+"/h in costs — close, but not quite covering itself yet. "+
        "A little more freight on this route would tip it into profit.";
  }
  return {cls:"bad",word:"Losing money",help:why,rate:rate,earn:earn,cost:cost};
}
// same idea as svcVerdict but for one truck -- what this specific vehicle is
// earning versus what it costs to keep on the road (wages + its own fuel burn)
function vehRate(v){
  if(!v.svc) return {cls:"warn",word:"Idle",rate:null};
  var age=(S.vehActiveH&&S.vehActiveH[v.id])||0;
  var rate=S.vehEma?S.vehEma[v.id]:null;
  var s=svcOf(v.svc);
  var warm=Math.max(8, s?svcCycle(s):8);
  if(age<warm||rate==null) return {cls:"warn",word:"Warming up",rate:null};
  var earn=S.vehEarnEma?S.vehEarnEma[v.id]:null, cost=S.vehCostEma?S.vehCostEma[v.id]:null;
  if(!S.vehCls) S.vehCls={};
  var cls=classifyRate(rate, S.vehCls[v.id]);
  S.vehCls[v.id]=cls;
  return {cls:cls, word:cls==="good"?"Profitable":cls==="warn"?"Breaking even":"Losing money",
          rate:rate, earn:earn, cost:cost};
}
// Is this line short of trucks, or short of freight? Both are fixable, but by
// opposite moves -- more vehicles versus a freight office, another stop, or
// different equipment -- and telling them apart from the profit figure alone
// is guesswork. This compares what the loop's trucks actually carry against
// what is standing at its stops waiting for them.
function svcSupply(s){
  var vs=svcVehs(s);
  if(!vs.length||s.stops.length<2) return null;
  var fill=(S.svcFillEma&&S.svcFillEma[s.id]);
  if(fill==null) return null;
  // freight standing at this loop's stops that these trucks could actually load
  var waitT=0, strandedT=0, strandedG={};
  s.stops.forEach(function(cid){
    S.loads.forEach(function(l){
      if(l.on||l.at!==cid) return;
      // only freight this loop could plausibly move: both ends on the loop.
      // Anything bound elsewhere is another service's business, not evidence
      // that this one is mis-equipped.
      if(s.stops.indexOf(l.to)<0) return;
      if(vs.some(function(v){ return vehTakes(v,l.g); })) waitT+=l.w;
      else { strandedT+=l.w; strandedG[l.g]=(strandedG[l.g]||0)+l.w; }
    });
  });
  var capT=0; vs.forEach(function(v){ capT+=tCap(v.type); });
  var pct=Math.round(fill*100), why, cls;
  // Primary read: are these trucks short of freight, or is the freight short
  // of trucks? Those need opposite fixes.
  if(waitT>capT*1.5){
    cls="warn";
    why="About "+Math.round(waitT)+"t is standing against "+capT+"t of capacity — well over what these trucks can lift "+
        "in one pass, and they are leaving "+pct+"% full. Another truck here would have freight waiting for it.";
  }else if(pct<45 && waitT<capT*0.5){
    cls="warn";
    why="Trucks leave only "+pct+"% full and just "+Math.round(waitT)+"t is waiting against "+capT+"t of capacity — "+
        "there is more truck here than freight. Build a freight office at a stop that ships, add a stop that ships "+
        "what these trucks carry, or move a truck to another loop.";
  }else{
    cls="good";
    why="Trucks leave about "+pct+"% full with roughly "+Math.round(waitT)+"t standing — capacity and freight are "+
        "reasonably matched on this loop.";
  }
  // Freight this loop generates that its current vehicles physically cannot
  // take is a separate problem with a separate fix, so it is called out
  // separately rather than replacing the headline.
  if(strandedT>Math.max(20,capT*0.35)){
    var gs=Object.keys(strandedG).sort(function(x,y){return strandedG[y]-strandedG[x];});
    var need={};
    gs.forEach(function(g){ var r=GOODS[g].req; if(r) need[r]=1; });
    var kit=Object.keys(need).map(function(r){
      return {reefer:"a reefer",tank:"a tanker",car:"a car transporter"}[r]; }).filter(Boolean);
    why+=" Separately, about "+Math.round(strandedT)+"t of "+
      gs.slice(0,3).map(function(g){return GOODS[g].n.toLowerCase();}).join(", ")+
      " is waiting that none of these vehicles can carry"+
      (kit.length? " — "+kit.join(" and ")+" on this loop would pick it up." : ".");
    if(cls==="good") cls="warn";
  }

function headway(s){
  var n=svcVehs(s).length;
  if(!n||s.stops.length<2) return Infinity;
  return svcCycle(s)/n;
}
// ride time from stop index i to stop index j, going forward around the loop
function rideH(s,i,j,type){
  var T=TRUCKS[type==null?1:type], t=0, n=s.stops.length, k=i;
  while(k!==j){ t+=km(s.stops[k],s.stops[(k+1)%n])/tSpeed(T.id) + dwellAt(s.stops[k],type==null?1:type); k=(k+1)%n; }
  return t;
}

/* ============================================================ ROUTER
   Dijkstra over cities. Boarding any service costs half its headway (the
   expected wait), which is exactly why coverage without frequency fails.  */
var routeCache={}, cacheKey=0;
function invalidate(){ routeCache={}; cacheKey++; }
function routePlan(fromId,toId,good){
  var req=(good&&GOODS[good]&&GOODS[good].req)||"";
  var ck=fromId+">"+toId+"|"+req;
  if(routeCache[ck]!==undefined) return routeCache[ck];
  // only services whose trucks carry this kind of freight are usable
  var live=S.svcs.filter(function(s){
    return s.stops.length>=2 && svcVehs(s).length>0 && (!req || svcCanCarry(s,good));
  });
  if(!live.length){ return (routeCache[ck]=null); }
  var dist={}, prev={}, done={};
  dist[fromId]=0;
  var guard=0;
  while(guard++<400){
    var u=null,best=Infinity;
    for(var k in dist){ if(!done[k]&&dist[k]<best){best=dist[k];u=k;} }
    if(u===null) break;
    if(u===toId) break;
    done[u]=true;
    live.forEach(function(s){
      var i=s.stops.indexOf(u); if(i<0) return;
      var wait=headway(s)/2;
      for(var n=1;n<s.stops.length;n++){
        var j=(i+n)%s.stops.length, v=s.stops[j];
        var cost=dist[u]+wait+rideH(s,i,j,null);
        if(dist[v]===undefined||cost<dist[v]){ dist[v]=cost; prev[v]={from:u,svc:s.id,i:i,j:j}; }
      }
    });
  }
  if(dist[toId]===undefined){ return (routeCache[ck]=null); }
  var legs=[],cur=toId;
  while(cur!==fromId){
    var p=prev[cur]; if(!p) return (routeCache[ck]=null);
    legs.unshift({svc:p.svc, from:p.from, to:cur});
    cur=p.from;
  }
  // collapse consecutive legs on the same service into one ride
  var merged=[];
  legs.forEach(function(l){
    var last=merged[merged.length-1];
    if(last&&last.svc===l.svc) last.to=l.to; else merged.push({svc:l.svc,from:l.from,to:l.to});
  });
  var plan={legs:merged, hours:dist[toId]};
  return (routeCache[ck]=plan);
}
function planFor(load){
  return routePlan(load.at||load.from, load.to, load.g);
}

  var r=GOODS[load.g]&&GOODS[load.g].req;
  if(!r) return false;
  return !S.veh.some(function(v){ return TRUCKS[v.type].spec===r; });

    S.xp-=xpNeed(S.level); S.level=(S.level||1)+1;
    var bonus=25000*S.level;
    S.cash+=bonus;

/* Investment is spatial. You do not buy abstract upgrades, you build up the

function buyDepot(id){
  var l=depotLvl(id); if(l>=3) return false;
  var c=DEPOT_COST[l]; if(S.cash<c) return false;
  S.cash-=c; S.spent+=c; if(!S.depot)S.depot={}; S.depot[id]=l+1; invalidate(); return true;
}
function buyOffice(id){
  var l=officeLvl(id); if(l>=3) return false;
  var c=OFFICE_COST[l]; if(S.cash<c) return false;
  S.cash-=c; S.spent+=c; if(!S.office)S.office={}; S.office[id]=l+1; return true;
}
/* Cities you have not reached yet are not on the map you can build with.

  var best=Infinity;
  for(var id in S.unlocked){ if(CITY[id]){ var d=km(id,c.id); if(d<best) best=d; } }
  return best===Infinity?0:best;
}
function unlockCost(c){
  var d=nearestUnlockedKm(c);
  return Math.round((9000+c.size*16000+d*95)/500)*500;

function unlockCity(id){
  var c=CITY[id]; if(!c||!cityLocked(id)) return false;
  var cost=unlockCost(c); if(S.cash<cost) return false;

function unlockedCount(){ return S.unlocked?Object.keys(S.unlocked).length:0; }

function assign(v,s){

    s.stops.forEach(function(id,i){ var c=CITY[id],d=(c.x-v.x)*(c.x-v.x)+(c.y-v.y)*(c.y-v.y);
      if(d<bd){bd=d;bi=i;} });
    v.si=bi; v.prog=0; v.dwell=0; v.at=s.stops[bi];
    var c0=CITY[s.stops[bi]]; v.x=c0.x; v.y=c0.y;
  }else{
    // every truck spawns at the same depot, so "nearest stop" would just stack
    // every truck into one convoy that arrives everywhere together and then
    // leaves each stop empty for the rest of the cycle -- the promised
    // frequency would exist only on paper. Drop new trucks into the biggest
    // gap on the loop instead, so they are actually spaced out.

function unassign(v){

function vehLoad(v){ var t=0; v.cargo.forEach(function(l){t+=l.w;}); return t; }

// Only possible while the vehicle is actually stopped somewhere: you cannot

function unloadCargo(v,idx){

  var s=v.svc?svcOf(v.svc):null;
  var cityId=v.at||(s&&s.stops[v.si]);

function arrive(v,s,tickEarn,tickVEarn){
  var cityId=s.stops[v.si];
  v.at=cityId;
  var T=TRUCKS[v.type];
  // drop anything whose plan leg ends here
  var keep=[];
  v.cargo.forEach(function(l){
    var leg=l.plan&&l.plan.legs[l.step];
    if(leg && leg.to===cityId){
      l.on=null; l.at=cityId; l.step++;
      if(l.step>=l.plan.legs.length){ deliver(l,cityId,s.id,tickEarn,v.id,tickVEarn); }
      else {
        // it changed services here: re-plan from this city, so the step index
        // must go back to the start of the new plan
        l.plan=null; l.step=0;
        if(S.loads.indexOf(l)<0) S.loads.push(l);

      return;
    }
    if(!leg){ l.on=null; l.at=cityId; l.plan=null; l.step=0; if(S.loads.indexOf(l)<0) S.loads.push(l); return; }
    keep.push(l);

  var space=tCap(v.type) - vehLoad(v);

    if(l.on||l.at!==cityId) return;
    if(!l.plan) l.plan=planFor(l);
    if(!l.plan||!l.plan.legs[l.step]) return;
    var leg=l.plan.legs[l.step];

// Should this vehicle sit at its current stop waiting for a fuller load?
// Only if the player asked it to, it is genuinely under that threshold, and
// there is freight here it could actually still load. A truck at a city that
// will never offer it anything -- nothing exported, or nothing its equipment
// or freight-type filter accepts -- leaves empty rather than blocking the
// loop, and STALL_GIVEUP stops a slow trickle turning into a true freeze.
// How much longer this truck may sit here before waiting starts costing more
// than a fuller trailer is worth. Two bounds, both of them things a real
// dispatcher actually weighs:
//   1. nothing already aboard may go late because we sat here, and
//   2. never sit longer than the gap between trucks on this line -- past that
//      point the truck is not adding capacity by filling up, it is subtracting

function holdBudget(v,s){

function step(dt){

    S.svcEarnEma[sv.id]=emaStep(S.svcEarnEma[sv.id]==null?null:S.svcEarnEma[sv.id], running?e/dt:0, dt, EMA_TAU);
    S.svcCostEma[sv.id]=emaStep(S.svcCostEma[sv.id]==null?null:S.svcCostEma[sv.id], running?c/dt:0, dt, EMA_TAU);

    var p=el("path",{class:"land",d:sh.d,fill:"url(#landC"+(sh.c||0)+")"});
    if(sh.iso) p.setAttribute("data-iso",sh.iso);
    gLand.appendChild(p);
  });
  buildGeoLabels();
  // faint graticule for depth, so the sea is not an empty void
  for(var gl=-10;gl<=26;gl+=4){ var gx=px(gl);
    gGrat.appendChild(el("line",{class:"grat",x1:gx,y1:-400,x2:gx,y2:VH+400})); }
  for(var gt=36;gt<=62;gt+=3){ var gy=py(gt);
    gGrat.appendChild(el("line",{class:"grat",x1:-400,y1:gy,x2:VW+400,y2:gy})); }
  CITIES.forEach(function(c){
    var g=el("g",{class:"cwrap","data-id":c.id});
    // pin geometry (halo/shadow/pad/glyph/badge) lives in its own sub-group so it
    // can be counter-scaled at deep zoom -- see updatePinScale(). The label has
    // its own independent counter-scale already, in doLabels().
    var pin=el("g",{class:"cpin",id:"cp-"+c.id});
    pin.appendChild(el("circle",{class:"chalo",cx:c.x,cy:c.y,r:11,id:"halo-"+c.id}));
    pin.appendChild(el("circle",{class:"cshadow",cx:c.x,cy:c.y+1.2,r:padR(c)}));
    pin.appendChild(el("circle",{class:"cpad",cx:c.x,cy:c.y,r:padR(c),id:"dot-"+c.id}));
    var gy2=el("text",{class:"cglyph",x:c.x,y:c.y+0.4,id:"gl-"+c.id,"font-size":glyphSize(c)});
    gy2.textContent=cityGlyph(c); pin.appendChild(gy2);
    g.appendChild(pin);
    g.appendChild(el("rect",{class:"lplate",id:"lp-"+c.id,x:0,y:0,width:0,height:0,rx:3}));
    var t=el("text",{class:"clabel",x:c.x,y:c.y-8,"text-anchor":"middle",id:"lb-"+c.id});
    t.textContent=c.n; g.appendChild(t);
    // The job-count badge lives in its own group, appended AFTER the label so it
    // always paints on top -- it used to live inside the pin (painted first),
    // which put the city name's own background plate right over the number
    // whenever the label sat in its default spot just above the pin.
    var bg2=el("g",{class:"cbadgeg",id:"cbg-"+c.id});
    bg2.appendChild(el("rect",{class:"cbadge",x:c.x+2.4,y:c.y+1.2,width:6,height:5.4,
      id:"bg-"+c.id,style:"display:none"}));
    var bt=el("text",{class:"cbadge-t",x:c.x+5.4,y:c.y+3.9,id:"bt-"+c.id,
      style:"display:none"}); bg2.appendChild(bt);
    g.appendChild(bg2);
    gCity.appendChild(g);
  });
}

// Pin geometry is plain world-space size, same as it always was, up to the zoom
// level the map used to top out at (PIN_CAP). Past that, this holds the pin's
// on-screen size fixed instead of letting it keep growing with the camera --
// otherwise the deeper zoom this round added makes every pin balloon.
// (Lowered from 6 in the visual overhaul: at 6 a served pin was ~30px across
// at normal play zoom and a busy cluster hid its own route lines.)
var PIN_CAP=2.4, lastPinS=null;
function pinK(){ return Math.min(1,PIN_CAP/cam.s); }
function updatePinScale(){
  if(cam.s===lastPinS) return;
  lastPinS=cam.s;
  var k=pinK();
  var tr=k===1?"":null;
  CITIES.forEach(function(c){
    var p=$("cp-"+c.id); if(!p) return;
    var t=tr===null?"translate("+c.x.toFixed(1)+" "+c.y.toFixed(1)+") scale("+k.toFixed(4)+
      ") translate("+(-c.x).toFixed(1)+" "+(-c.y).toFixed(1)+")":tr;
    if(p.getAttribute("transform")!==t){
      if(t) p.setAttribute("transform",t); else p.removeAttribute("transform");
    }
    // the badge group needs the same fixed-on-screen-size treatment as the pin
    // it hovers next to, or it would keep growing with the camera past PIN_CAP
    var bg=$("cbg-"+c.id); if(bg){
      if(bg.getAttribute("transform")!==t){
        if(t) bg.setAttribute("transform",t); else bg.removeAttribute("transform");
      }
    }
  });
}
function padR(c){ return c.home?7.5 : 4.6+Math.min(3.2,c.size*0.72); }
// the radius actually drawn -- a locked city is a small waypoint dot
function pinR(c){ return cityLocked(c.id)?1.5 : c.home?3.8 : 2.6+Math.min(1,c.size*0.2); }
function glyphSize(c){ return (padR(c)*1.18).toFixed(1); }
// a pin shows what the place actually ships, so the map itself teaches the trade
function cityGlyph(c){
  if(c.home) return "\uD83C\uDFE0";
  if(c.out&&c.out.length) return GOODS[c.out[0]].ic;
  if(c.capital) return "\u2605";
  if(c.port) return "\u2693";
  return "\u25CF";
}
function servedCities(){
  var set={};
  S.svcs.forEach(function(s){ if(svcVehs(s).length) s.stops.forEach(function(id){set[id]=1;}); });
  return set;
}
// writing an attribute that is already set to the same value still costs a
// style/layout invalidation on some engines (notably mobile Safari), and
// this runs on every city/land path on a timer -- so only touch the DOM
// when a value has actually changed.
function setAttrIf(el,name,val){ if(el.getAttribute(name)!==String(val)) el.setAttribute(name,val); }
function refreshCities(){
  var served=servedCities();

  Object.keys(served).forEach(function(id){ isoServed[CITY[id].c]=1; });
  Array.prototype.forEach.call(gLand.children,function(p){
    var iso=p.getAttribute("data-iso");
    setAttrIf(p,"class", iso&&isoServed[iso] ? "land mine" : "land");
  });
  var waiting={};
  S.loads.forEach(function(l){ if(!l.on&&l.at) waiting[l.at]=(waiting[l.at]||0)+1; });
  var editSvc=(tab==="services"&&svcEdit!=null)?svcOf(svcEdit):null;
  CITIES.forEach(function(c){
    var d=$("dot-"+c.id), l=$("lb-"+c.id), g=$("gl-"+c.id);
    var locked=cityLocked(c.id);
    var inRoute=editSvc&&editSvc.stops.indexOf(c.id)>=0;
    var cl="cpad"+(c.home?" home":served[c.id]?" served":"")+(selCity===c.id?" sel":"")+
      (locked?" locked":editSvc?(inRoute?" inedit":" addable"):"");
    setAttrIf(d,"class",cl);
    if(editSvc&&inRoute){ setAttrIf(d,"stroke",editSvc.col); setAttrIf(d,"stroke-width",3); }
    else{
      var inv=!locked&&(depotLvl(c.id)||officeLvl(c.id));
      setAttrIf(d,"stroke-width", inv?3:(c.home||served[c.id]?1.9:1.4));
      if(inv) setAttrIf(d,"stroke","#f0a63c"); else if(d.hasAttribute("stroke")) d.removeAttribute("stroke");
    }
    if(g){ var wantGlyph=locked?"🔒":cityGlyph(c); if(g.textContent!==wantGlyph) g.textContent=wantGlyph; }
    // a locked city draws as a small hollow waypoint instead of a full pin;
    // the tap target in tapMap() still uses padR, so it is just as easy to hit
    setAttrIf(d,"r",pinR(c));
    var pinG=$("cp-"+c.id); if(pinG) setAttrIf(pinG,"class","cpin"+(locked?" locked":""));
    var plate=$("lp-"+c.id); if(plate) setAttrIf(plate,"class","lplate"+(locked?" locked":""));
    var halo=$("halo-"+c.id);
    if(halo) setAttrIf(halo,"class","chalo"+(waiting[c.id]&&served[c.id]?" on":""));
    var bg=$("bg-"+c.id), bt=$("bt-"+c.id), n=waiting[c.id]||0;
    if(bg){ var show=(n&&!locked)?"":"none"; if(bg.style.display!==show){ bg.style.display=show; bt.style.display=show; }
            if(n&&bt.textContent!==(n>9?"9+":String(n))) bt.textContent=n>9?"9+":n; }

    // otherwise wipe the "hide" class straight back off a suppressed label
    setAttrIf(l,"class","clabel"+(served[c.id]||c.home?" served":"")+(locked?" locked":"")+
      (l.classList.contains("hide")?" hide":""));

}
// Rebuilds the route lines from scratch. Only call this when the STOP LIST
// of a service actually changed (or on boot) -- it tears down and recreates
// every polyline, which is wasteful to run on a timer. The performance
// colour updates separately, in place, via refreshSvcHealth().
function drawSvcs(){
  gSvc.innerHTML=""; gSvcFlow.innerHTML="";
  S.svcs.forEach(function(s){
    if(s.stops.length<2) return;
    var pts=[];
    for(var i=0;i<=s.stops.length;i++){ var c=CITY[s.stops[i%s.stops.length]]; pts.push(c.x+","+c.y); }
    var p=pts.join(" ");
    gSvc.appendChild(el("polyline",{class:"svccase","data-svc":s.id,points:p}));
    gSvc.appendChild(el("polyline",{class:"svcline","data-svc":s.id,points:p}));
    // a thin dashed line, animated to march along the loop, so a running
    // route visibly carries traffic instead of just sitting there coloured
    // in. Only drawn for routes actually working (a truck assigned) -- an
    // empty route has no traffic to show. Plain stroke-dasharray animation,
    // not a filter: cheap to repaint on every pan/zoom frame, unlike the
    // coastline drop-shadow that cost 80% of pan fps and got pulled in v6.4.
    if(svcVehs(s).length) gSvcFlow.appendChild(el("polyline",
      {class:"svcflow","data-svc":s.id,points:p,stroke:s.col}));
  });
  drawEditPreview();
  refreshSvcHealth();
}
// Runs on the periodic UI tick. Never touches gSvc's route shapes -- only
// recolours the existing line by how the service is actually doing. With
// several services running, a floating "-EUR/h" label per losing one gets
// unreadable fast and doesn't say which line it belongs to -- the line's own
// colour says that for free, and tapping it (see hitSvcLine in tapMap) opens
// the full breakdown instead.
var PERF_CLS={good:"perf-good",warn:"perf-warn",bad:"perf-bad"};
function refreshSvcHealth(){
  S.svcs.forEach(function(s){
    if(s.stops.length<2) return;
    var vd=svcVerdict(s);
    var line=gSvc.querySelector('.svcline[data-svc="'+s.id+'"]');
    if(!line) return;
    var want=PERF_CLS[vd.cls]||"";
    if(!line.classList.contains(want)){
      line.classList.remove("perf-good","perf-warn","perf-bad");
      if(want) line.classList.add(want);
    }
  });
}
// while a service is being edited, sketch the route as stops are tapped in,
// so building it on the map is a direct loop rather than a blind list
function drawEditPreview(){
  var old=gSvcFlow.querySelector(".editprev-g"); if(old) old.remove();
  if(!(tab==="services"&&svcEdit!=null)) return;
  var s=svcOf(svcEdit); if(!s||s.stops.length<1) return;
  var g=el("g",{class:"editprev-g"});
  var pts=s.stops.map(function(id){ var c=CITY[id]; return c.x+","+c.y; });
  if(s.stops.length>=2) pts.push(pts[0]);

  gSvcFlow.appendChild(g);

var vehEls={};
function drawVehs(){
  var seen={};
  S.veh.forEach(function(v){
    if(!v.svc){ return; }
    var s=svcOf(v.svc); if(!s) return;
    seen[v.id]=1;
    var rec=vehEls[v.id];
    if(rec && rec.col===s.col && rec.type===v.type){
      // hot path: only the transform and the load bar actually change
      rec.g.setAttribute("transform","translate("+v.x.toFixed(1)+" "+v.y.toFixed(1)+")"+
        (rec.glyph?"":" rotate("+(v.hd||0).toFixed(0)+")")+" scale("+(1/cam.s).toFixed(3)+")");
      if(rec.bar){
        var f=Math.min(1,vehLoad(v)/tCap(v.type));
        rec.bar.setAttribute("width",(rec.barW*f).toFixed(2));
        rec.bar.style.display=f>0?"":"none";
        rec.body.setAttribute("fill",f>0?"#3a4756":"#2a3440");
      }
      return;
    }
    if(rec&&rec.g.parentNode) rec.g.parentNode.removeChild(rec.g);
    var sc=(1/cam.s);
    var T=TRUCKS[v.type];
    // ships and planes get a simple glyph marker rather than the truck
    // silhouette -- they don't turn to face the road, so no rotation either
    if(T.mode==="sea"||T.mode==="air"){
      var g2=el("g",{class:"veh",transform:"translate("+v.x.toFixed(1)+" "+v.y.toFixed(1)+") scale("+sc.toFixed(3)+")"});
      var big2=(T.cap>=100?1.5:1.2)*1.1;
      g2.appendChild(el("circle",{cx:0,cy:0,r:6.2*big2,fill:s.col,opacity:.92,stroke:"#070c11","stroke-width":.7}));
      var gt=el("text",{x:0,y:0.5,"text-anchor":"middle","dominant-baseline":"central","font-size":7.4*big2});
      gt.textContent=T.ic; g2.appendChild(gt);
      gVeh.appendChild(g2);
      vehEls[v.id]={g:g2,col:s.col,type:v.type,glyph:true};
      return;
    }
    var g=el("g",{class:"veh",transform:"translate("+v.x.toFixed(1)+" "+v.y.toFixed(1)+") rotate("+
      (v.hd||0).toFixed(0)+") scale("+sc.toFixed(3)+")"});
    var loaded=v.cargo.length>0;
    var big=(T.cap>=40?1.45:T.cap>=20?1.2:1)*1.15;                     // silhouette by class
    g.appendChild(el("ellipse",{cx:0,cy:2.4*big,rx:7*big,ry:2.6*big,fill:"#03070b",opacity:.4}));
    var body=el("rect",{x:-7*big,y:-3.1*big,width:9.4*big,height:6.2*big,rx:1.3,
      fill:loaded?"#3a4756":"#2a3440",stroke:"#070c11","stroke-width":.7});
    g.appendChild(body);                                                           // trailer body
    var f0=Math.min(1,vehLoad(v)/tCap(T.id));
    var bar=el("rect",{x:-6.6*big,y:-2.6*big,width:8.6*big*f0,height:5.2*big,rx:1,
      fill:s.col,opacity:.92});
    if(!f0) bar.style.display="none";
    g.appendChild(bar);                                                            // load gauge
    g.appendChild(el("rect",{x:2.6*big,y:-2.9*big,width:4.4*big,height:5.8*big,rx:1.2,
      fill:s.col,stroke:"#070c11","stroke-width":.7}));                            // cab
    g.appendChild(el("rect",{x:5.2*big,y:-2*big,width:1.5*big,height:4*big,rx:.5,
      fill:"#cfe6ff",opacity:.85}));                                               // windscreen
    gVeh.appendChild(g);
    vehEls[v.id]={g:g,bar:bar,body:body,barW:8.6*big,col:s.col,type:v.type};
  });
  // retire sprites for trucks that have left a service or been sold
  for(var k in vehEls){ if(!seen[k]){ var e2=vehEls[k];
    if(e2.g.parentNode) e2.g.parentNode.removeChild(e2.g); delete vehEls[k]; } }
}
function pipFly(cityId,txt,col){

  var c=CITY[cityId]; if(!c) return;

function applyCam(){
  gWorld.setAttribute("transform","translate("+cam.tx.toFixed(2)+" "+cam.ty.toFixed(2)+") scale("+cam.s.toFixed(4)+")");
  updatePinScale();

// Atlas names grow with the map like print, but only up to a point: past
// GEO_MAX px they hold their size, or a deep zoom fills the screen with one
// giant "GERMANY" sitting on top of your network.
var GEO_MAX={geolbl:15,sealbl:14}, lastGeoS=null;
function scaleGeoLabels(){
  if(cam.s===lastGeoS) return; lastGeoS=cam.s;
  var k=viewK().k;
  Array.prototype.forEach.call($("gGeoLbl").children,function(t){
    var fs=+t.getAttribute("font-size"), x=t.getAttribute("x"), y=t.getAttribute("y");
    var q=Math.min(1,GEO_MAX[t.getAttribute("class")]/(fs*cam.s*k));
    if(q<1) t.setAttribute("transform","translate("+x+" "+y+") scale("+q.toFixed(4)+") translate("+(-x)+" "+(-y)+")");
    else t.removeAttribute("transform");

// Fits the continents you actually have cities unlocked on, not the whole
// world -- a fresh game only has Europe unlocked, so this should frame
// Europe exactly like it always did, not shrink it into a world view. It
// grows to include a new continent the moment you unlock a city there.
function fitAll(){
  var touched={};
  for(var id in (S.unlocked||{})) if(CITY[id]) touched[cityContinent(CITY[id])]=1;
  if(!Object.keys(touched).length) touched.eu=1;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  CITIES.forEach(function(c){ if(!touched[cityContinent(c)]) return;
    minx=Math.min(minx,c.x);maxx=Math.max(maxx,c.x);
    miny=Math.min(miny,c.y);maxy=Math.max(maxy,c.y); });
  var pad=40; minx-=pad;miny-=pad;maxx+=pad;maxy+=pad;
  var s=Math.min(VW/(maxx-minx), VH/(maxy-miny));
  cam.s=Math.max(0.6,Math.min(3,s));
  cam.tx=VW/2-cam.s*(minx+maxx)/2; cam.ty=VH/2-cam.s*(miny+maxy)/2;
  applyCam();
}
// keep labels a constant size and drop ones that would collide
function viewK(){ var r=svg.getBoundingClientRect(); var m=svg.getScreenCTM&&svg.getScreenCTM();
  if(!m||!r.width) return {k:1,ox:0,oy:0,w:r.width||1,h:r.height||1};
  return {k:m.a||1,ox:m.e-r.left,oy:m.f-r.top,w:r.width,h:r.height}; }
// doLabels() sorts and collision-tests every city on screen -- necessary
// when the zoom level changes, wasted work on a pure pan (everything moves
// together rigidly, so which labels collide does not change). Panning fires
// this on every pointermove, so without a throttle it reruns full layout up
// to 60 times a second while dragging. Labels lagging ~100ms behind a drag
// is invisible; the drag stuttering because of them is not.
var lblRAF=0, lblLast=0;
function layoutLabels(){
  if(lblRAF) return;
  var wait=Math.max(0, 110-(performance.now()-lblLast));
  lblRAF=setTimeout(function(){ lblRAF=0; lblLast=performance.now();
    requestAnimationFrame(doLabels); }, wait);
}
function doLabels(){
  var X=viewK(), k=X.k, L=1/(k*cam.s);
  var served=servedCities();
  var order=CITIES.slice().sort(function(a,b){
    var pa=a.home?0:served[a.id]?1:2, pb=b.home?0:served[b.id]?1:2;
    if(pa!==pb) return pa-pb; return b.size-a.size;
  });

  // fixed 9px from its centre (which put them on top of the bigger pins)
  var pk=Math.min(cam.s,PIN_CAP)*k;
  function rs(c){ return pinR(c)*pk; }
  var placed=[], marks=CITIES.map(function(c){
    var cx=(c.x*cam.s+cam.tx)*k+X.ox, cy=(c.y*cam.s+cam.ty)*k+X.oy, r=Math.max(4,rs(c));
    return {x0:cx-r,y0:cy-r,x1:cx+r,y1:cy+r,id:c.id};
  });
  function hit(b,list,skip){ for(var i=0;i<list.length;i++){ var p=list[i];
    if(p.id!==undefined&&p.id===skip) continue;
    if(b.x0<p.x1&&b.x1>p.x0&&b.y0<p.y1&&b.y1>p.y0) return true; } return false; }
  order.forEach(function(c){
    var t=$("lb-"+c.id);
    t.setAttribute("transform","translate("+c.x.toFixed(2)+" "+c.y.toFixed(2)+") scale("+L.toFixed(4)+
      ") translate("+(-c.x).toFixed(2)+" "+(-c.y).toFixed(2)+")");
    if(c._w==null){ try{ c._w=t.getComputedTextLength()||c.n.length*6; }catch(e){ c._w=c.n.length*6; } }
    var cx=(c.x*cam.s+cam.tx)*k+X.ox, cy=(c.y*cam.s+cam.ty)*k+X.oy;
    var r0=rs(c);
    var cands=[[0,-(r0+4),"middle"],[0,r0+12,"middle"],[r0+5,4,"start"],[-(r0+5),4,"end"]];
    for(var i=0;i<cands.length;i++){
      var dx=cands[i][0],dy=cands[i][1],an=cands[i][2];
      var w=c._w, x0=an==="end"?cx+dx-w:an==="middle"?cx+dx-w/2:cx+dx;
      var box={x0:x0-2,y0:cy+dy-10,x1:x0+w+2,y1:cy+dy+3};
      if(box.x0<0||box.x1>X.w||box.y0<0||box.y1>X.h) continue;
      if(hit(box,placed)||hit(box,marks,c.id)) continue;
      t.setAttribute("x",c.x+dx); t.setAttribute("y",c.y+dy); t.setAttribute("text-anchor",an);
      var lp=$("lp-"+c.id);
      if(lp){ var pw=(w+8), ph=13;
        var lx = an==="end" ? c.x+dx-w-4 : an==="middle" ? c.x+dx-w/2-4 : c.x+dx-4;
        lp.setAttribute("x",lx); lp.setAttribute("y",c.y+dy-10);
        lp.setAttribute("width",pw); lp.setAttribute("height",ph);
        lp.setAttribute("transform",t.getAttribute("transform")); lp.style.display=""; }
      placed.push(box); t.classList.remove("hide"); return;
    }
    t.classList.add("hide");
    var lp2=$("lp-"+c.id); if(lp2) lp2.style.display="none";
  });
}

/* pan + zoom */
var ptrs={}, drag=false, lastPt=null, pinch=null;
function toSvg(cx,cy){ var m=svg.getScreenCTM(); if(!m) return {x:cx,y:cy};
  var p=svg.createSVGPoint(); p.x=cx;p.y=cy; var r=p.matrixTransform(m.inverse()); return {x:r.x,y:r.y}; }
// The world map's base scale (px per degree) is ~5.5x coarser than the old
// Europe-only map's was, so the zoom ceiling has to rise to match -- without
// this, the old cap of 6 left no way to focus tight on, say, just Benelux.
function zoomAt(x,y,ns){ ns=Math.max(0.6,Math.min(40,ns));
  var wx=(x-cam.tx)/cam.s, wy=(y-cam.ty)/cam.s;
  cam.s=ns; cam.tx=x-ns*wx; cam.ty=y-ns*wy; applyCam(); }
var wrap=$("mapwrap");
wrap.addEventListener("pointerdown",function(e){
  try{wrap.setPointerCapture(e.pointerId);}catch(x){}
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY}; drag=false; lastPt=toSvg(e.clientX,e.clientY);
  var ids=Object.keys(ptrs);
  if(ids.length===2){ var a=ptrs[ids[0]],b=ptrs[ids[1]]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s0:cam.s}; }
});
wrap.addEventListener("pointermove",function(e){
  if(!ptrs[e.pointerId]) return;
  ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  var ids=Object.keys(ptrs);
  if(ids.length===2&&pinch){ var a=ptrs[ids[0]],b=ptrs[ids[1]];
    var nd=Math.hypot(a.x-b.x,a.y-b.y), mid=toSvg((a.x+b.x)/2,(a.y+b.y)/2);
    zoomAt(mid.x,mid.y,pinch.s0*(nd/pinch.d)); drag=true; return; }
  var cur=toSvg(e.clientX,e.clientY);
  if(lastPt){ var dx=cur.x-lastPt.x, dy=cur.y-lastPt.y;
    cam.tx+=dx; cam.ty+=dy; applyCam(); if(Math.hypot(dx,dy)>0.5) drag=true; }
  lastPt=cur;
});
function upH(e){
  var wasDrag=drag;
  delete ptrs[e.pointerId]; if(Object.keys(ptrs).length<2) pinch=null;
  if(!Object.keys(ptrs).length){
    lastPt=null;
    if(!wasDrag && e.clientX!=null) tapMap(e.clientX,e.clientY);
  }
}
// distance from a point to the nearest point on a line segment -- used to
// tell whether a tap landed on a route line, not just a city pin
function distToSeg(px,py,x1,y1,x2,y2){
  var dx=x2-x1, dy=y2-y1, len2=dx*dx+dy*dy;
  var t=len2>0 ? Math.max(0,Math.min(1,((px-x1)*dx+(py-y1)*dy)/len2)) : 0;
  return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));
}
function hitSvcLine(wx,wy){
  var bd=9/cam.s, best=null;
  S.svcs.forEach(function(s){
    if(s.stops.length<2) return;
    for(var i=0;i<s.stops.length;i++){
      var a=CITY[s.stops[i]], b=CITY[s.stops[(i+1)%s.stops.length]];
      var d=distToSeg(wx,wy,a.x,a.y,b.x,b.y);
      if(d<bd){ bd=d; best=s; }
    }
  });
  return best;
}
function tapMap(cx,cy){
  var p=toSvg(cx,cy), wx=(p.x-cam.tx)/cam.s, wy=(p.y-cam.ty)/cam.s;
  // Tap target has to match the pin you can actually see. It used to be a flat
  // 16px regardless of zoom, while the pin is drawn at padR and then held at a
  // constant on-screen size past PIN_CAP -- so a pin that looked big had a
  // small target, and tapping its edge silently did nothing (or worse, fell
  // through to the route line underneath). Size the target off the rendered
  // radius instead, plus a finger's worth of margin.
  // Two passes so the margin can never steal a tap from the pin you actually
  // hit: anything inside a drawn pin wins outright, and only if the tap landed
  // on bare map do we widen to the surrounding margin.
  var best=null, bd=Infinity, near=null, nd=Infinity, k=pinK();
  CITIES.forEach(function(c){
    var d=Math.hypot(c.x-wx,c.y-wy), r=padR(c)*k;
    if(d<=r){ if(d<bd){ bd=d; best=c; } }
    else if(d<=r+11/cam.s && d<nd){ nd=d; near=c; }
  });
  if(!best) best=near;
  if(!best){
    // no city under the tap -- maybe a route line was tapped instead. Not
    // while actively editing a (possibly different) service, since taps
    // there are already spoken for by the route-building gesture below.
    if(!(tab==="services"&&svcEdit!=null)){
      var hitSvc=hitSvcLine(wx,wy);
      if(hitSvc){ svcEdit=hitSvc.id; setTab("services"); render(); }
    }
    return;
  }
  // editing a service: tapping the map IS building the route -- tap a new
  // city to append it, tap one already on the loop to drop it. This is the
  // whole point of showing the map at all instead of just a text list.
  if(tab==="services"&&svcEdit!=null){
    var s=svcOf(svcEdit); if(!s) return;
    var idx=s.stops.indexOf(best.id);
    if(idx>=0){ s.stops.splice(idx,1); afterEdit(s); return; }
    if(cityLocked(best.id)){
      toast("🔒 <b>"+best.n+"</b> is locked — unlock it in the City tab for "+eur(unlockCost(best))+".");
      selCity=best.id; return;
    }
    s.stops.push(best.id);
    afterEdit(s);
    return;
  }
  selCity=best.id; setTab("city"); refreshCities();
}

// Pointer-based drag reordering for the stop list -- works with touch as well
// as mouse, unlike HTML5 drag-and-drop. The dragged row follows the pointer
// directly; the rows it passes over slide aside to show where it will land.
// The array itself is only spliced once, on release.
function makeStopsDraggable(wrapS,s){
  var rows=Array.prototype.slice.call(wrapS.querySelectorAll(".stop"));
  if(rows.length<2) return;
  rows.forEach(function(row,dragIdx){
    var h=row.querySelector(".draghandle");
    if(!h) return;
    h.addEventListener("pointerdown",function(e){
      e.preventDefault();
      var startY=e.clientY, target=dragIdx;
      row.classList.add("dragging");
      // Rows are not all the same height -- a stop with a long "ships ..." line
      // wraps -- so work out where the drag has landed by comparing the dragged
      // row's centre against each row's own centre, rather than assuming a
      // uniform row pitch.
      var mids=rows.map(function(r){ var b=r.getBoundingClientRect(); return b.top+b.height/2; });
      function move(ev){
        var dy=ev.clientY-startY;
        row.style.transform="translateY("+dy+"px)";
        var c=mids[dragIdx]+dy;
        target=dragIdx;
        for(var t=0;t<rows.length;t++){
          if(t<dragIdx && c<mids[t]){ target=t; break; }
          if(t>dragIdx && c>mids[t]) target=t;
        }
        var rh=row.getBoundingClientRect().height;
        rows.forEach(function(r,ri){
          if(r===row) return;
          var shift=0;
          if(target>dragIdx && ri>dragIdx && ri<=target) shift=-rh;
          else if(target<dragIdx && ri>=target && ri<dragIdx) shift=rh;
          r.style.transform=shift?"translateY("+shift+"px)":"";
        });
      }
      function up(){
        window.removeEventListener("pointermove",move);
        window.removeEventListener("pointerup",up);
        window.removeEventListener("pointercancel",up);
        if(target!==dragIdx){
          var id=s.stops.splice(dragIdx,1)[0];
          s.stops.splice(target,0,id);
          afterEdit(s);
        }else{
          row.classList.remove("dragging"); row.style.transform="";
          rows.forEach(function(r){ r.style.transform=""; });
        }
      }
      window.addEventListener("pointermove",move);
      window.addEventListener("pointerup",up);
      window.addEventListener("pointercancel",up);
    });
  });
}

    b.appendChild(info);
